<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="운동">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>운동 기록</title>
<style>
:root{--bg:#fff;--fg:#0a0a0a;--mute:#8a8a8a;--line:#e5e5e5;--soft:#f5f5f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#fff;--line:#262626;--soft:#161616;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#fff;--line:#262626;--soft:#161616;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:28px 20px 90px}
button{font:inherit;cursor:pointer;color:inherit}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;letter-spacing:-.02em}
.ghost{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:12px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin:18px 0 24px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--fg);color:var(--bg)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.nav h2{margin:0;font-size:22px;letter-spacing:-.03em}
.nav h2 small{display:block;font-size:12px;color:var(--mute);font-weight:500;letter-spacing:0}
.nav button{width:38px;height:38px;border:1px solid var(--line);background:none;border-radius:50%;font-size:16px}
.card{border:1px solid var(--fg);border-radius:16px;padding:18px}
.card .row{display:flex;justify-content:space-between;align-items:baseline}
.big{font-size:40px;font-weight:700;letter-spacing:-.04em;line-height:1}
.big small{font-size:18px;color:var(--mute);font-weight:500}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg);transition:width .3s}
.mute{color:var(--mute);font-size:13px}
form{display:flex;gap:8px;margin:22px 0 16px}
input,select{font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--fg)}
form input{flex:1}
.add{padding:0 18px;border:0;background:var(--fg);color:var(--bg);border-radius:12px;font-weight:600}
ul{list-style:none;margin:0;padding:0}
li.it{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.chk{width:26px;height:26px;border:1.5px solid var(--fg);border-radius:50%;flex:none;background:none;padding:0;display:grid;place-items:center;color:var(--bg)}
.chk svg{width:14px;height:14px;opacity:0}
.done .chk{background:var(--fg)}.done .chk svg{opacity:1}
.nm{flex:1;word-break:break-word}
.done .nm{color:var(--mute);text-decoration:line-through}
.val{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.val input{width:72px;padding:8px;text-align:right;font-size:15px}
.x{border:0;background:none;font-size:20px;color:var(--mute);padding:0 4px}
.empty{text-align:center;color:var(--mute);padding:36px 0;font-size:14px;border:1px dashed var(--line);border-radius:12px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow span{text-align:center;font-size:11px;color:var(--mute);padding-bottom:4px}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;padding:0}
.cell.tdy{border-color:var(--fg);font-weight:700}
.cell.full{background:var(--fg);color:var(--bg)}
.cell .dots{display:flex;gap:2px;height:5px}
.cell .dots i{width:5px;height:5px;border-radius:50%;background:currentColor}
.cell.part{background:var(--soft)}
.cell.void{border:0;pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:13px}
.chips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
h3{font-size:14px;margin:26px 0 8px}
svg.ch{width:100%;height:auto;display:block}
.stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.stat b{font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.sheet div{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));font-size:14px;line-height:1.7}
.sheet h4{margin:0 0 10px;font-size:17px}
.sheet button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:600}
</style>
</head>
<body>
<main>
<div class="top"><div class="logo">● 운동 기록</div><button class="ghost" id="inst">홈 화면에 추가</button></div>
<div class="tabs" id="tabs"><button data-t="today" class="on">오늘</button><button data-t="cal">달력</button><button data-t="stat">통계</button></div>
<div id="v"></div>
</main>
<div class="sheet" id="sheet"><div>
<h4>홈 화면에 추가하기</h4>
<b>iPhone (Safari)</b><br>하단 공유 버튼 → “홈 화면에 추가”<br>
<b>Android (Chrome)</b><br>우측 상단 ⋮ 메뉴 → “홈 화면에 추가” 또는 “앱 설치”<br>
<b>PC (Chrome·Edge)</b><br>주소창 오른쪽의 설치 아이콘 클릭
<p class="mute">기록은 이 기기에만 저장되고 인터넷 없이도 열려요. 홈 화면 앱과 브라우저의 저장 공간이 분리되는 기기에서는 기록이 따로 보일 수 있어요.</p>
<button id="sx">닫기</button></div></div>
<script>
(function(){
var KEY='workout-tracker-v2',OLD='workout-tracker-v1';
var S={items:[],logs:{}};
try{var r=localStorage.getItem(KEY);
 if(r){var p=JSON.parse(r);if(p&&p.items){S=p;S.logs=S.logs||{};}}
 else{var o=JSON.parse(localStorage.getItem(OLD)||'null');
  if(o&&o.items){S.items=o.items.map(function(i){return{id:i.id,name:i.name,unit:''}});
   Object.keys(o.done||{}).forEach(function(d){S.logs[d]={};o.done[d].forEach(function(id){S.logs[d][id]={d:1}})})}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(s){return document.querySelector(s)};
var P=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+P(d.getMonth()+1)+'-'+P(d.getDate())};
var TODAY=ymd(new Date()),cur=TODAY,month=TODAY.slice(0,7),tab='today',sel=null,edit=false;
var DW=['일','월','화','수','목','금','토'];
var CK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function lg(d,id){return(S.logs[d]&&S.logs[d][id])||{}}
function setLg(d,id,o){S.logs[d]=S.logs[d]||{};S.logs[d][id]=Object.assign(lg(d,id),o)}
function doneCnt(d){return S.items.filter(function(i){return lg(d,i.id).d}).length}
function fmt(n){return Math.round(n*100)/100}
function shiftDate(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)}
function shiftMonth(m,n){var a=m.split('-'),d=new Date(+a[0],+a[1]-1+n,1);return d.getFullYear()+'-'+P(d.getMonth()+1)}
function dim(m){var a=m.split('-');return new Date(+a[0],+a[1],0).getDate()}

function today(){
 var d=new Date(cur+'T00:00:00'),n=S.items.length,c=doneCnt(cur),pct=n?Math.round(c/n*100):0;
 var h='<div class="nav"><button id="pv">‹</button><h2>'+(d.getMonth()+1)+'월 '+d.getDate()+'일<small>'+DW[d.getDay()]+'요일'+(cur===TODAY?' · 오늘':'')+'</small></h2><button id="nx">›</button></div>'+
 '<div class="card"><div class="row"><div class="big">'+c+'<small> / '+n+'</small></div><b>'+pct+'%</b></div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="mute" style="margin-top:10px">'+(!n?'운동을 추가해 보세요.':c===n?'모든 운동을 완료했어요.':'남은 운동 '+(n-c)+'개')+'</div></div>'+
 '<form id="f"><input id="nm" placeholder="운동 추가 (예: 달리기)" maxlength="30" autocomplete="off"><select id="un"><option value="">체크만</option><option>km</option><option>개</option><option>분</option><option>회</option></select><button class="add">추가</button></form>';
 h+='<ul>';
 S.items.forEach(function(i){var l=lg(cur,i.id);
  h+='<li class="it'+(l.d?' done':'')+'" data-id="'+i.id+'"><button class="chk" data-a="t">'+CK+'</button><span class="nm"></span>'+
  (i.unit?'<span class="val"><input type="number" inputmode="decimal" step="any" min="0" data-a="v" value="'+(l.v||'')+'" placeholder="0">'+i.unit+'</span>':'')+
  (edit?'<button class="x" data-a="x" aria-label="삭제">×</button>':'')+'</li>'});
 h+='</ul>'+(n?'':'<div class="empty">아직 운동 항목이 없어요.</div>')+
 (n?'<button class="ghost" id="ed" style="margin-top:8px">'+(edit?'편집 완료':'항목 삭제 편집')+'</button>':'');
 $('#v').innerHTML=h;
 document.querySelectorAll('li.it').forEach(function(li){var i=S.items.filter(function(x){return x.id===li.dataset.id})[0];li.querySelector('.nm').textContent=i.name});
 $('#pv').onclick=function(){cur=shiftDate(cur,-1);render()};
 $('#nx').onclick=function(){cur=shiftDate(cur,1);render()};
 $('#f').onsubmit=function(e){e.preventDefault();var v=$('#nm').value.trim();if(!v)return;
  S.items.push({id:'e'+Date.now()+Math.floor(Math.random()*999),name:v,unit:$('#un').value});save();render()};
 if($('#ed'))$('#ed').onclick=function(){edit=!edit;render()};
 document.querySelectorAll('[data-a]').forEach(function(el){
  var id=el.closest('li').dataset.id,a=el.dataset.a;
  if(a==='t')el.onclick=function(){setLg(cur,id,{d:lg(cur,id).d?0:1});save();render()};
  if(a==='x')el.onclick=function(){S.items=S.items.filter(function(x){return x.id!==id});
   Object.keys(S.logs).forEach(function(k){delete S.logs[k][id]});save();render()};
  if(a==='v')el.onchange=function(){var n=parseFloat(el.value);n=n>0?n:0;setLg(cur,id,n>0?{v:n,d:1}:{v:0});save();render()};
 });
}

function monthNav(){var a=month.split('-');
 return '<div class="nav"><button id="pm">‹</button><h2>'+a[0]+'년 '+(+a[1])+'월</h2><button id="nm2">›</button></div>'}
function bindMonth(){$('#pm').onclick=function(){month=shiftMonth(month,-1);render()};$('#nm2').onclick=function(){month=shiftMonth(month,1);render()}}

function cal(){
 var a=month.split('-'),first=new Date(+a[0],+a[1]-1,1).getDay(),n=dim(month),t=S.items.length;
 var h=monthNav()+'<div class="dow">'+DW.map(function(x){return'<span>'+x+'</span>'}).join('')+'</div><div class="grid">';
 for(var i=0;i<first;i++)h+='<div class="cell void"></div>';
 for(var d=1;d<=n;d++){var k=month+'-'+P(d),c=doneCnt(k),cl='cell'+(k===TODAY?' tdy':'')+(t&&c===t?' full':c?' part':'');
  h+='<button class="'+cl+'" data-d="'+k+'"><span>'+d+'</span><span class="dots">'+(c?'<i></i>':'')+'</span></button>'}
 h+='</div><p class="mute">날짜를 누르면 그날의 기록을 보고 수정할 수 있어요. 채워진 칸은 모든 운동을 완료한 날이에요.</p>';
 $('#v').innerHTML=h;bindMonth();
 document.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){cur=b.dataset.d;tab='today';render()}});
}

function stat(){
 var n=dim(month),t=S.items.length,days=[],k;
 for(var d=1;d<=n;d++)days.push(month+'-'+P(d));
 var units=S.items.filter(function(i){return i.unit});
 if(!sel||!units.some(function(i){return i.id===sel}))sel=units[0]?units[0].id:null;
 var full=days.filter(function(k){return t&&doneCnt(k)===t}).length,act=days.filter(function(k){return doneCnt(k)>0}).length;
 var h=monthNav()+'<div class="card"><div class="row"><div class="big">'+act+'<small> / '+n+'일</small></div><b>운동한 날</b></div><div class="mute" style="margin-top:10px">전체 완료 '+full+'일</div></div>';
 h+='<h3>일별 완료 개수</h3>'+bars(days,t);
 if(units.length){
  h+='<h3>누적 수치</h3><div class="chips">'+units.map(function(i){return'<button data-s="'+i.id+'" class="'+(i.id===sel?'on':'')+'"></button>'}).join('')+'</div>'+cum(days);
 }
 h+='<h3>항목별 월간 합계</h3>';
 if(!t)h+='<div class="empty">운동 항목이 없어요.</div>';
 S.items.forEach(function(i){var dc=0,sum=0;days.forEach(function(k){var l=lg(k,i.id);if(l.d)dc++;sum+=l.v||0});
  h+='<div class="stat"><span class="nm2"></span><span><b>'+dc+'일</b>'+(i.unit?' · '+fmt(sum)+i.unit:'')+'</span></div>'});
 $('#v').innerHTML=h;bindMonth();
 var ui=0;document.querySelectorAll('.nm2').forEach(function(el,x){el.textContent=S.items[x].name});
 document.querySelectorAll('[data-s]').forEach(function(b){b.textContent=S.items.filter(function(i){return i.id===b.dataset.s})[0].name;b.onclick=function(){sel=b.dataset.s;render()}});
}
function bars(days,t){
 var W=320,H=120,m=18,bw=(W-m*2)/days.length,max=Math.max(t,1),s='<svg class="ch" viewBox="0 0 '+W+' '+(H+22)+'"><line x1="'+m+'" y1="'+H+'" x2="'+(W-m)+'" y2="'+H+'" stroke="var(--line)"/>';
 days.forEach(function(k,i){var c=doneCnt(k),bh=c/max*(H-10);
  s+='<rect x="'+(m+i*bw+1)+'" y="'+(H-bh)+'" width="'+Math.max(bw-2,1)+'" height="'+bh+'" rx="1.5" fill="var(--fg)"/>'});
 [1,10,20,days.length].forEach(function(d){s+='<text x="'+(m+(d-.5)*bw)+'" y="'+(H+15)+'" font-size="9" text-anchor="middle" fill="var(--mute)">'+d+'</text>'});
 return s+'</svg>'}
function cum(days){
 var it=S.items.filter(function(i){return i.id===sel})[0],W=320,H=130,m=22,t=0,pts=[],tot=0;
 days.forEach(function(k){tot+=lg(k,sel).v||0;pts.push(tot)});
 var max=Math.max(tot,1),n=days.length,xs=function(i){return m+i*(W-m*2)/(n-1)},ys=function(v){return H-v/max*(H-16)};
 var line=pts.map(function(v,i){return xs(i)+','+ys(v)}).join(' ');
 var s='<svg class="ch" viewBox="0 0 '+W+' '+(H+22)+'"><line x1="'+m+'" y1="'+H+'" x2="'+(W-m)+'" y2="'+H+'" stroke="var(--line)"/>'+
 '<polyline points="'+m+','+H+' '+line+' '+xs(n-1)+','+H+'" fill="var(--soft)" stroke="none"/><polyline points="'+line+'" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/>'+
 '<circle cx="'+xs(n-1)+'" cy="'+ys(tot)+'" r="3.5" fill="var(--fg)"/><text x="'+(W-m)+'" y="'+Math.max(ys(tot)-9,10)+'" font-size="11" font-weight="700" text-anchor="end" fill="var(--fg)">'+fmt(tot)+it.unit+'</text>';
 [1,10,20,n].forEach(function(d){s+='<text x="'+xs(d-1)+'" y="'+(H+15)+'" font-size="9" text-anchor="middle" fill="var(--mute)">'+d+'</text>'});
 return s+'</svg>'}

function render(){
 document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});
 (tab==='today'?today:tab==='cal'?cal:stat)();
}
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){tab=b.dataset.t;render()}});

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}
var dp=null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e});
$('#inst').onclick=function(){if(dp){dp.prompt();dp=null}else $('#sheet').classList.add('on')};
$('#sx').onclick=function(){$('#sheet').classList.remove('on')};
render();
})();
</script>
</body>
</html>
