<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>온라인 도장 및 사인 생성기</title>
    <!-- 상업용 무료 구글 폰트 6종 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Nanum+Myeongjo:wght@700&family=Nanum+Pen+Script&family=Nanum+Brush+Script&family=Hi+Melody&family=Gamja+Flower&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Nanum Myeongjo', sans-serif; 
            background-color: #f4f4f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        .container { 
            background: white; 
            padding: 25px 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 420px; 
        }
        
        /* 탭 디자인 */
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: #777;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            color: #dc3545;
            border-bottom: 3px solid #dc3545;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; color: #555; }
        input[type="text"], select { 
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; outline: none;
        }
        input:focus, select:focus { border-color: #dc3545; }
        
        .radio-group { display: flex; gap: 15px; margin-bottom: 15px; font-family: sans-serif; font-size: 14px; }
        .radio-group label { display: inline-flex; align-items: center; font-weight: normal; cursor: pointer; }
        
        .canvas-container { 
            margin: 20px 0; display: flex; justify-content: center; background: #fafafa; padding: 20px; border-radius: 8px; border: 1px solid #eee;
            touch-action: none; /* 모바일 캔버스 드래그 시 스크롤 방지 */
        }
        canvas { 
            max-width: 100%; height: auto; border: 1px dashed #ccc; background: transparent; cursor: crosshair;
        }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        button.action-btn { 
            flex: 1; padding: 14px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; 
        }
        .btn-generate { background-color: #343a40; }
        .btn-download { background-color: #dc3545; }
        .btn-clear { background-color: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('dojang')">서명 도장</button>
        <button class="tab-btn" onclick="switchTab('sign')">커스텀 사인</button>
    </div>

    <!-- 도장 탭 -->
    <div id="dojang-tab" class="tab-content active">
        <div class="form-group">
            <label for="nameInput">이름 (최대 3글자 입력)</label>
            <input type="text" id="nameInput" placeholder="예: 홍길동" maxlength="4" value="홍길동">
        </div>
        <div class="form-group">
            <label for="fontSelect">글씨체 선택</label>
            <select id="fontSelect">
                <option value="'Nanum Myeongjo'">나눔명조 (기본 정자체)</option>
                <option value="'East Sea Dokdo'">독도체 (개성있는 붓글씨)</option>
                <option value="'Nanum Pen Script'">나눔 필기체</option>
            </select>
        </div>
        <div class="form-group">
            <label for="shapeSelect">외곽선 모양</label>
            <select id="shapeSelect">
                <option value="circle">원형 (기본)</option>
                <option value="square">사각형 (결재인)</option>
            </select>
        </div>
        <div class="canvas-container">
            <canvas id="dojangCanvas" width="150" height="150"></canvas>
        </div>
        <div class="btn-group">
            <button class="action-btn btn-download" onclick="downloadImage('dojangCanvas', 'nameInput', '도장')">투명 배경 다운로드</button>
        </div>
    </div>

    <!-- 사인 탭 -->
    <div id="sign-tab" class="tab-content">
        <div class="radio-group">
            <label><input type="radio" name="signMode" value="draw" checked onchange="toggleSignMode()"> 직접 그리기</label>
            <label><input type="radio" name="signMode" value="text" onchange="toggleSignMode()"> 폰트로 만들기</label>
        </div>
        
        <div id="sign-text-options" style="display: none;">
            <div class="form-group">
                <label for="signInput">사인 내용</label>
                <input type="text" id="signInput" placeholder="이름 또는 영문 입력" value="홍길동">
            </div>
            <div class="form-group">
                <label for="signFontSelect">손글씨 폰트 (무료 5종)</label>
                <select id="signFontSelect">
                    <option value="'Nanum Pen Script'">나눔 필기체</option>
                    <option value="'Nanum Brush Script'">나눔 브러시체</option>
                    <option value="'Hi Melody'">하이 멜로디체</option>
                    <option value="'Gamja Flower'">감자꽃 마을체</option>
                    <option value="'East Sea Dokdo'">독도 붓글씨체</option>
                </select>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="signCanvas" width="300" height="150"></canvas>
        </div>
        
        <div class="btn-group">
            <button class="action-btn btn-clear" onclick="clearSignCanvas()">다시 쓰기 / 지우기</button>
            <button class="action-btn btn-download" onclick="downloadImage('signCanvas', 'signInput', '사인')">투명 배경 다운로드</button>
        </div>
    </div>
</div>

<script>
    // --- 탭 전환 로직 ---
    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(tabId + '-tab').classList.add('active');
    }

    // --- 도장 렌더링 로직 ---
    async function generateDojang() {
        const canvas = document.getElementById('dojangCanvas');
        const ctx = canvas.getContext('2d');
        const name = document.getElementById('nameInput').value.trim();
        const font = document.getElementById('fontSelect').value;
        const shape = document.getElementById('shapeSelect').value;

        let text = name;
        if (text.length === 3) text += "인";
        else if (text.length === 2) text += "의인";
        else if (text.length === 1) text += "의도장";
        
        while (text.length < 4) text += " ";
        text = text.substring(0, 4);

        let fontSize = font.includes("Dokdo") ? 65 : (font.includes("Pen Script") ? 70 : 55);
        
        try { await document.fonts.load(`${fontSize}px ${font}`); } catch (e) {}

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const color = '#dc3545';
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;

        if (shape === 'circle') {
            ctx.arc(centerX, centerY, 68, 0, 2 * Math.PI);
        } else {
            const size = 136, x = centerX - size/2, y = centerY - size/2;
            ctx.roundRect ? ctx.roundRect(x, y, size, size, 12) : ctx.rect(x, y, size, size);
        }
        ctx.stroke();

        ctx.fillStyle = color;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = `${fontSize}px ${font}`;

        const offset = 33;
        const positions = [
            { x: centerX + offset, y: centerY - offset },
            { x: centerX + offset, y: centerY + offset },
            { x: centerX - offset, y: centerY - offset },
            { x: centerX - offset, y: centerY + offset }
        ];

        let yAdjust = font.includes("Dokdo") ? 2 : (font.includes("Pen Script") ? 8 : 5);

        for (let i = 0; i < 4; i++) {
            ctx.fillText(text[i], positions[i].x, positions[i].y + yAdjust);
        }
    }

    // --- 사인 로직 ---
    const signCanvas = document.getElementById('signCanvas');
    const sCtx = signCanvas.getContext('2d');
    let isDrawing = false;

    // 캔버스 좌표 계산 (반응형 크기 대응)
    function getMousePos(canvas, evt) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX = evt.clientX;
        let clientY = evt.clientY;
        
        if(evt.touches && evt.touches.length > 0) {
            clientX = evt.touches[0].clientX;
            clientY = evt.touches[0].clientY;
        }

        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }

    function startPosition(e) {
        if(document.querySelector('input[name="signMode"]:checked').value === 'text') return;
        e.preventDefault();
        isDrawing = true;
        draw(e);
    }

    function endPosition() {
        isDrawing = false;
        sCtx.beginPath();
    }

    function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        
        const pos = getMousePos(signCanvas, e);
        sCtx.lineWidth = 4;
        sCtx.lineCap = 'round';
        sCtx.strokeStyle = '#000000';

        sCtx.lineTo(pos.x, pos.y);
        sCtx.stroke();
        sCtx.beginPath();
        sCtx.moveTo(pos.x, pos.y);
    }

    // 마우스 및 터치 이벤트 연결
    signCanvas.addEventListener('mousedown', startPosition);
    signCanvas.addEventListener('mouseup', endPosition);
    signCanvas.addEventListener('mousemove', draw);
    signCanvas.addEventListener('touchstart', startPosition, { passive: false });
    signCanvas.addEventListener('touchend', endPosition);
    signCanvas.addEventListener('touchmove', draw, { passive: false });

    // 사인 모드 변경 (그리기 vs 폰트)
    function toggleSignMode() {
        const mode = document.querySelector('input[name="signMode"]:checked').value;
        const textOptions = document.getElementById('sign-text-options');
        
        clearSignCanvas();
        if (mode === 'text') {
            textOptions.style.display = 'block';
            generateSignText();
        } else {
            textOptions.style.display = 'none';
        }
    }

    // 폰트 기반 사인 생성
    async function generateSignText() {
        const mode = document.querySelector('input[name="signMode"]:checked').value;
        if (mode !== 'text') return;
        
        const text = document.getElementById('signInput').value.trim();
        const font = document.getElementById('signFontSelect').value;
        let fontSize = 65; 

        try { await document.fonts.load(`${fontSize}px ${font}`); } catch (e) {}

        clearSignCanvas();
        sCtx.fillStyle = '#000000';
        sCtx.textAlign = 'center';
        sCtx.textBaseline = 'middle';
        sCtx.font = `${fontSize}px ${font}`;
        sCtx.fillText(text, signCanvas.width / 2, signCanvas.height / 2 + 5);
    }

    function clearSignCanvas() {
        sCtx.clearRect(0, 0, signCanvas.width, signCanvas.height);
        if(document.querySelector('input[name="signMode"]:checked').value === 'text') {
            generateSignText();
        }
    }

    // 공통 이미지 다운로드 함수
    function downloadImage(canvasId, inputId, defaultNameSuffix) {
        const canvas = document.getElementById(canvasId);
        const link = document.createElement('a');
        const name = document.getElementById(inputId).value.trim() || '서명';
        link.download = `${name}_${defaultNameSuffix}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
    }

    // 이벤트 리스너 등록
    document.getElementById('nameInput').addEventListener('input', generateDojang);
    document.getElementById('fontSelect').addEventListener('change', generateDojang);
    document.getElementById('shapeSelect').addEventListener('change', generateDojang);
    
    document.getElementById('signInput').addEventListener('input', generateSignText);
    document.getElementById('signFontSelect').addEventListener('change', generateSignText);

    // 초기 로딩
    document.fonts.ready.then(() => {
        generateDojang();
    });
</script>

</body>
</html>
