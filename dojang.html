<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 반응형을 위한 뷰포트 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>온라인 도장 생성기</title>
    <!-- 상업용 무료 구글 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Nanum+Myeongjo:wght@700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Nanum Myeongjo', sans-serif; 
            background-color: #f4f4f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        .container { 
            background: white; 
            padding: 25px 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 400px; 
            width: 100%; 
        }
        h1 { 
            font-size: 22px; 
            margin-top: 0;
            margin-bottom: 20px; 
            color: #333; 
        }
        .form-group { 
            margin-bottom: 15px; 
            text-align: left; 
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: bold; 
            font-size: 14px; 
            color: #555;
        }
        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            font-size: 16px; 
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            border-color: #dc3545;
        }
        .canvas-container { 
            margin: 20px 0; 
            display: flex; 
            justify-content: center; 
            background: #fafafa; 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid #eee;
        }
        canvas { 
            /* 모바일 화면에서도 캔버스가 이쁘게 보이도록 설정 */
            max-width: 100%; 
            height: auto; 
            border: 1px dashed #ccc; 
            background: transparent; 
        }
        .btn-group { 
            display: flex; 
            flex-direction: column; /* 모바일을 위해 세로 배치 기본 설정 */
            gap: 10px; 
        }
        @media (min-width: 350px) {
            .btn-group { flex-direction: row; } /* 약간 큰 화면부터는 가로 배치 */
        }
        button { 
            flex: 1; 
            padding: 14px; 
            font-size: 16px; 
            font-weight: bold; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            color: white; 
            transition: opacity 0.2s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-generate { background-color: #343a40; }
        .btn-download { background-color: #dc3545; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <h1>서명 도장 생성기</h1>
    
    <div class="form-group">
        <label for="nameInput">이름 (최대 3글자 입력)</label>
        <input type="text" id="nameInput" placeholder="예: 홍길동" maxlength="4" value="홍길동">
    </div>

    <div class="form-group">
        <label for="fontSelect">글씨체 선택 (무료 폰트)</label>
        <select id="fontSelect">
            <option value="'Nanum Myeongjo'">나눔명조 (기본 정자체)</option>
            <option value="'East Sea Dokdo'">독도체 (개성있는 붓글씨)</option>
            <option value="'Nanum Pen Script'">나눔 필기체</option>
        </select>
    </div>

    <div class="form-group">
        <label for="shapeSelect">외곽선 모양</label>
        <select id="shapeSelect">
            <option value="circle">원형 (기본)</option>
            <option value="square">사각형 (결재인)</option>
        </select>
    </div>

    <div class="canvas-container">
        <!-- 캔버스의 실제 해상도는 높게(150x150) 유지하여 선명하게 다운로드되게 함 -->
        <canvas id="dojangCanvas" width="150" height="150"></canvas>
    </div>

    <div class="btn-group">
        <button class="btn-generate" onclick="generateDojang()">새로고침</button>
        <button class="btn-download" onclick="downloadDojang()">투명 배경 다운로드</button>
    </div>
</div>

<script>
    async function generateDojang() {
        const canvas = document.getElementById('dojangCanvas');
        const ctx = canvas.getContext('2d');
        const name = document.getElementById('nameInput').value.trim();
        const font = document.getElementById('fontSelect').value;
        const shape = document.getElementById('shapeSelect').value;

        // 이름 처리 (세 글자일 경우 '인' 추가, 길이에 따라 유동적 처리)
        let text = name;
        if (text.length === 3) text += "인";
        else if (text.length === 2) text += "의인";
        else if (text.length === 1) text += "의도장";
        
        while (text.length < 4) text += " ";
        text = text.substring(0, 4);

        // 폰트에 따른 크기 미세 조정
        let fontSize = font.includes("Dokdo") ? 65 : (font.includes("Pen Script") ? 70 : 55);
        
        // ★ 핵심 수정: 캔버스에 그리기 전에 웹 폰트가 완전히 로드되도록 대기
        try {
            await document.fonts.load(`${fontSize}px ${font}`);
        } catch (e) {
            console.log("폰트 로드 중 오류 발생:", e);
        }

        // 캔버스 초기화 (투명 배경)
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const color = '#dc3545'; // 도장 빨간색
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = 68;

        // 외곽선 그리기
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;

        if (shape === 'circle') {
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
        } else {
            // 모서리가 약간 둥근 사각형
            const size = 136;
            const x = centerX - size/2;
            const y = centerY - size/2;
            ctx.roundRect ? ctx.roundRect(x, y, size, size, 12) : ctx.rect(x, y, size, size);
        }
        ctx.stroke();

        // 글씨 쓰기 설정
        ctx.fillStyle = color;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = `${fontSize}px ${font}`;

        // 2x2 배열 위치 계산 (우상, 우하, 좌상, 좌하 순서)
        const offset = 33;
        const positions = [
            { x: centerX + offset, y: centerY - offset }, // 1글자 (우상)
            { x: centerX + offset, y: centerY + offset }, // 2글자 (우하)
            { x: centerX - offset, y: centerY - offset }, // 3글자 (좌상)
            { x: centerX - offset, y: centerY + offset }  // 4글자 (좌하)
        ];

        // 폰트별 y좌표 미세 보정 (폰트마다 베이스라인이 다르기 때문)
        let yAdjust = 5;
        if (font.includes("Dokdo")) yAdjust = 2;
        if (font.includes("Pen Script")) yAdjust = 8;

        for (let i = 0; i < 4; i++) {
            ctx.fillText(text[i], positions[i].x, positions[i].y + yAdjust);
        }
    }

    function downloadDojang() {
        const canvas = document.getElementById('dojangCanvas');
        const link = document.createElement('a');
        const name = document.getElementById('nameInput').value.trim() || '도장';
        link.download = `${name}_도장.png`;
        // 투명 배경이 포함된 PNG로 내보내기
        link.href = canvas.toDataURL("image/png");
        link.click();
    }

    // 이름 입력란이나 설정이 변경될 때마다 자동으로 도장 업데이트
    document.getElementById('nameInput').addEventListener('input', generateDojang);
    document.getElementById('fontSelect').addEventListener('change', generateDojang);
    document.getElementById('shapeSelect').addEventListener('change', generateDojang);

    // 페이지 접속 시 모든 폰트가 로드되는 것을 기다린 후 초기 렌더링 실행
    document.fonts.ready.then(() => {
        generateDojang();
    });
</script>

</body>
</html>
