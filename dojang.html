<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>도장 & 커스텀 사인 생성기</title>
    <!-- 구글 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Nanum+Myeongjo:wght@700&family=Nanum+Pen+Script&family=Nanum+Brush+Script&family=Hi+Melody&family=Gamja+Flower&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nanum Myeongjo', sans-serif; background-color: #e9ecef; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .wrap { background: #fff; padding: 25px 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; font-size: 22px; margin-top: 0; margin-bottom: 20px; color: #333; }
        
        .tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 20px; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-weight: bold; color: #aaa; transition: 0.2s; }
        .tab.active { color: #d9534f; border-bottom: 3px solid #d9534f; }
        .content { display: none; }
        .content.active { display: block; }
        
        .box { margin-bottom: 15px; }
        .box label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #555; }
        .box input[type="text"], .box select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
        
        .radio-group { margin-bottom: 15px; display: flex; gap: 15px; }
        .radio-group label { font-weight: normal; font-size: 14px; cursor: pointer; }
        
        .canvas-box { background: #f8f9fa; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 15px; touch-action: none; border: 1px solid #eee; }
        canvas { border: 1px dashed #bbb; max-width: 100%; cursor: crosshair; }
        
        .btns { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 14px; font-size: 15px; font-weight: bold; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
        .btn-red { background: #d9534f; }
        .btn-gray { background: #6c757d; }
        
        /* 폰트 강제 로딩을 위한 숨김 처리 */
        .font-preload { position: absolute; left: -9999px; visibility: hidden; }
    </style>
</head>
<body>

<!-- 브라우저가 폰트를 무시하지 않도록 강제로 한 번씩 렌더링 시킴 -->
<div class="font-preload">
    <span style="font-family: 'Nanum Myeongjo';">폰트로드</span>
    <span style="font-family: 'East Sea Dokdo';">폰트로드</span>
    <span style="font-family: 'Nanum Pen Script';">폰트로드</span>
    <span style="font-family: 'Nanum Brush Script';">폰트로드</span>
    <span style="font-family: 'Hi Melody';">폰트로드</span>
    <span style="font-family: 'Gamja Flower';">폰트로드</span>
</div>

<div class="wrap">
    <h2>도장 & 커스텀 사인</h2>
    
    <div class="tabs">
        <div class="tab active" id="tab-dojang" onclick="goTab('dojang')">서명 도장</div>
        <div class="tab" id="tab-sign" onclick="goTab('sign')">커스텀 사인</div>
    </div>

    <!-- 도장 탭 -->
    <div id="content-dojang" class="content active">
        <div class="box">
            <label>이름 (최대 3글자)</label>
            <input type="text" id="nameInput" value="홍길동" maxlength="4">
        </div>
        <div class="box">
            <label>글씨체 선택</label>
            <select id="fontSelect">
                <option value="Nanum Myeongjo">나눔명조 (기본 정자체)</option>
                <option value="East Sea Dokdo">독도체 (개성있는 붓글씨)</option>
                <option value="Nanum Pen Script">나눔 필기체</option>
            </select>
        </div>
        <div class="box">
            <label>외곽선 모양</label>
            <select id="shapeSelect">
                <option value="circle">원형 (기본)</option>
                <option value="square">사각형 (결재인)</option>
            </select>
        </div>
        <div class="canvas-box">
            <canvas id="dojangCanvas" width="150" height="150"></canvas>
        </div>
        <div class="btns">
            <button class="btn btn-red" onclick="downloadImg('dojangCanvas', 'nameInput', '도장')">투명 배경 다운로드</button>
        </div>
    </div>

    <!-- 사인 탭 -->
    <div id="content-sign" class="content">
        <div class="radio-group">
            <label><input type="radio" name="signMode" value="draw" checked onchange="changeSignMode()"> 직접 그리기</label>
            <label><input type="radio" name="signMode" value="text" onchange="changeSignMode()"> 폰트로 만들기</label>
        </div>
        
        <div id="sign-text-box" style="display: none;">
            <div class="box">
                <label>사인 내용</label>
                <input type="text" id="signInput" value="홍길동">
            </div>
            <div class="box">
                <label>손글씨 폰트</label>
                <select id="signFontSelect">
                    <option value="Nanum Pen Script">나눔 필기체</option>
                    <option value="Nanum Brush Script">나눔 브러시체</option>
                    <option value="Hi Melody">하이 멜로디체</option>
                    <option value="Gamja Flower">감자꽃 마을체</option>
                    <option value="East Sea Dokdo">독도 붓글씨체</option>
                </select>
            </div>
        </div>

        <div class="canvas-box">
            <canvas id="signCanvas" width="300" height="150"></canvas>
        </div>
        <div class="btns">
            <button class="btn btn-gray" onclick="clearSign()">다시 쓰기 / 지우기</button>
            <button class="btn btn-red" onclick="downloadImg('signCanvas', 'signInput', '사인')">투명 배경 다운로드</button>
        </div>
    </div>
</div>

<script>
    // 탭 이동 기능
    function goTab(tabName) {
        document.querySelectorAll('.tab').forEach(function(el) { el.classList.remove('active'); });
        document.querySelectorAll('.content').forEach(function(el) { el.classList.remove('active'); });
        document.getElementById('tab-' + tabName).classList.add('active');
        document.getElementById('content-' + tabName).classList.add('active');
        
        if(tabName === 'dojang') drawDojang();
        if(tabName === 'sign' && getRadioValue('signMode') === 'text') drawSignText();
    }
