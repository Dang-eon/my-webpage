<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>독도의 날 기념 퀴즈</title>
<style>
:root{--bg:#e8f4ff;--card:#fff;--text:#12304f;--sub:#546e8a;--line:#c3d9ef;--main:#1f6fd1;--ok:#1e9e5a;--okbg:#dff5e8;--no:#d6453d;--nobg:#fde6e4;--sea:#2a7fd4;--rock:#7d756b;--grass:#5aa469;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1726;--card:#162a40;--text:#e8f1fb;--sub:#9db4cc;--line:#2c4560;--main:#5ea3f5;--ok:#4cc88a;--okbg:#17382a;--no:#f0817a;--nobg:#3f1f1e;--sea:#1b5fa8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1726;--card:#162a40;--text:#e8f1fb;--sub:#9db4cc;--line:#2c4560;--main:#5ea3f5;--ok:#4cc88a;--okbg:#17382a;--no:#f0817a;--nobg:#3f1f1e;--sea:#1b5fa8;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,#1b5fa8,#2a8fd8);color:#fff;text-align:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;font-weight:800;font-size:1.2rem;letter-spacing:.02em;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.app{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:24px;text-align:center;overflow:hidden}
h1{font-size:1.9rem;margin:.3em 0}h2{margin:.2em 0}
p{color:var(--sub);font-size:1.1rem;line-height:1.6}
svg.scene{width:100%;max-width:420px;height:auto;display:block;margin:0 auto 8px}
.top{display:flex;justify-content:space-between;font-weight:700;color:var(--sub);margin-bottom:8px}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--main);transition:width .3s}
.q{font-size:1.5rem;font-weight:700;line-height:1.5;margin:8px 0 20px}
.opts{display:grid;gap:12px}
.opt{font:inherit;font-size:1.25rem;min-height:64px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;text-align:left}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.no{background:var(--nobg);border-color:var(--no);color:var(--no);animation:sh .35s}
.opt:disabled{cursor:default}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{min-height:3.4rem;margin-top:16px;font-size:1.25rem;font-weight:700;line-height:1.4}
.msg.ok{color:var(--ok)}.msg.no{color:var(--no)}
.btn{font:inherit;font-size:1.15rem;font-weight:700;padding:14px 28px;border:0;border-radius:16px;background:var(--main);color:#fff;cursor:pointer;margin:6px 4px}
.btn.alt{background:transparent;color:var(--main);border:2px solid var(--main)}
.btn[hidden],[hidden]{display:none!important}
.score{font-size:3.4rem;font-weight:800;color:var(--main);margin:8px 0}
.tag{display:inline-block;background:var(--okbg);color:var(--ok);border-radius:999px;padding:4px 14px;font-weight:700;margin-top:4px}
.fld{display:block;text-align:left;font-weight:700;margin:12px 0 4px;color:var(--text)}
input[type=text]{font:inherit;font-size:1.1rem;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row input[type=radio]{width:26px;height:26px;flex:none;accent-color:var(--ok)}
.hint{text-align:left;font-size:.95rem;color:var(--sub);margin:4px 0}
.mine{text-align:left;margin-top:16px}
.mine div{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mine button{font:inherit;border:0;background:var(--nobg);color:var(--no);border-radius:10px;padding:6px 12px;cursor:pointer}
@media (min-width:700px){.opts{grid-template-columns:1fr 1fr}.q{font-size:1.7rem}header{font-size:1.4rem}.app{padding:24px}}
@media (max-width:420px){.app{padding:10px}.card{padding:16px;border-radius:18px}h1{font-size:1.55rem}.q{font-size:1.25rem}.opt{font-size:1.1rem;min-height:58px}header{font-size:1.02rem}.score{font-size:2.8rem}.btn{width:100%;margin:6px 0}}
</style>
</head>
<body>
<header>🏝️ 10월 25일 독도의 날 기념 퀴즈</header>
<div class="app">
  <div class="card" id="start">
    <svg class="scene" viewBox="0 0 420 200" role="img" aria-label="바다 위의 독도 동도와 서도, 갈매기, 태극기">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd3ff"/><stop offset="1" stop-color="#e6f5ff"/></linearGradient></defs>
      <rect width="420" height="200" fill="url(#sky)" rx="16"/>
      <circle cx="340" cy="48" r="26" fill="#ffd56b"/>
      <rect y="120" width="420" height="80" fill="var(--sea)"/>
      <path d="M40 126 L70 80 L88 92 L108 70 L140 126Z" fill="var(--rock)"/>
      <path d="M40 126 L58 100 L90 104 L90 126Z" fill="var(--grass)" opacity=".8"/>
      <path d="M170 126 L196 86 L214 98 L236 74 L268 126Z" fill="var(--rock)"/>
      <path d="M170 126 L190 104 L222 106 L222 126Z" fill="var(--grass)" opacity=".8"/>
      <text x="74" y="144" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">서도</text>
      <text x="220" y="144" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">동도</text>
      <line x1="108" y1="70" x2="108" y2="48" stroke="#555" stroke-width="2"/>
      <rect x="108" y="48" width="22" height="15" fill="#fff" stroke="#999"/>
      <circle cx="119" cy="55.5" r="4" fill="#d6453d"/><path d="M115 55.5a4 4 0 0 0 8 0z" fill="#1f5fd1"/>
      <path d="M290 40q10-10 20 0q10-10 20 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <path d="M250 24q7-7 14 0q7-7 14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 150q26-10 52 0t52 0t52 0t52 0t52 0t52 0t52 0t52 0" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/>
      <path d="M0 172q26-10 52 0t52 0t52 0t52 0t52 0t52 0t52 0t52 0" fill="none" stroke="#fff" stroke-width="2" opacity=".4"/>
    </svg>
    <h1>독도 퀴즈에 도전!</h1>
    <p>문제은행 <b id="cnt">30</b>문제 중 10문제가 무작위로 나와요.<br>문제당 10점! 틀릴 때마다 2점씩 줄어들어요.</p>
    <button class="btn" id="go">시작하기</button>
    <button class="btn alt" id="addBtn">✏️ 문제 추가하기</button>
  </div>

  <div class="card" id="play" hidden>
    <div class="top"><span id="no">1 / 10</span><span id="sc">0점</span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <button class="btn" id="next" hidden>다음 문제</button>
  </div>

  <div class="card" id="end" hidden>
    <div style="font-size:3rem" id="medal"></div>
    <h1>퀴즈 끝!</h1>
    <div class="score" id="final"></div>
    <p id="comment"></p>
    <button class="btn" id="again">다시 도전하기</button>
    <button class="btn alt" id="home">처음으로</button>
  </div>

  <div class="card" id="add" hidden>
    <h2>✏️ 나만의 문제 만들기</h2>
    <p class="hint">문제와 보기 4개를 쓰고, 정답 보기 왼쪽 동그라미를 눌러 주세요. 만든 문제는 문제은행에 들어가요.</p>
    <label class="fld" for="nq">문제</label>
    <input type="text" id="nq" maxlength="80" placeholder="예: 독도의 날은 몇 월 며칠일까요?">
    <div class="fld">보기 (정답을 선택)</div>
    <div class="row"><input type="radio" name="ans" value="0" checked aria-label="1번이 정답"><input type="text" class="no" maxlength="40" placeholder="1번 보기"></div>
    <div class="row"><input type="radio" name="ans" value="1" aria-label="2번이 정답"><input type="text" class="no" maxlength="40" placeholder="2번 보기"></div>
    <div class="row"><input type="radio" name="ans" value="2" aria-label="3번이 정답"><input type="text" class="no" maxlength="40" placeholder="3번 보기"></div>
    <div class="row"><input type="radio" name="ans" value="3" aria-label="4번이 정답"><input type="text" class="no" maxlength="40" placeholder="4번 보기"></div>
    <div class="msg" id="addMsg"></div>
    <button class="btn" id="save">문제 저장</button>
    <button class="btn alt" id="back">돌아가기</button>
    <div class="mine" id="mine"></div>
    <p class="hint">※ 추가한 문제는 이 기기의 이 브라우저에만 저장돼요.</p>
  </div>
</div>
<script>
var BASE=[
["독도의 날은 언제일까요?",["3월 1일","8월 15일","10월 25일","12월 25일"],2],
["독도는 어느 바다에 있을까요?",["동해","서해","남해","태평양"],0],
["독도는 어느 나라의 땅일까요?",["일본","중국","러시아","대한민국"],3],
["독도는 큰 섬 두 개가 중심이에요. 그 이름은?",["동도와 서도","남도와 북도","상도와 하도","큰섬과 작은섬"],0],
["독도에서 가장 가까운 우리나라 섬은?",["제주도","울릉도","거제도","강화도"],1],
["독도의 주소는 어느 지역에 속할까요?",["제주특별자치도","부산광역시","강원도 동해시","경상북도 울릉군"],3],
["독도에 살고 천연기념물로 보호받는 새는?",["펭귄","독수리","괭이갈매기","앵무새"],2],
["독도를 지키려고 애쓴 조선 시대 인물은?",["안용복","유관순","세종대왕","김구"],0],
["독도에서 펄럭이는 우리나라 국기의 이름은?",["일장기","태극기","오성홍기","성조기"],1],
["독도의 날은 무엇을 위한 날일까요?",["독도를 사랑하고 지키려는 마음을 기르는 날","새 학년이 시작되는 날","추수를 감사하는 날","한글을 만든 날"],0],
["1900년 독도를 울도군에 속한다고 밝힌 나라는?",["대한제국","고려","발해","신라"],0],
["독도는 울릉도에서 어느 쪽에 있을까요?",["동남쪽","서북쪽","정북쪽","서남쪽"],0],
["독도는 어떻게 만들어진 섬일까요?",["산호가 쌓여서","화산 활동으로","모래가 쌓여서","사람이 만들어서"],1],
["신라 시대에 우산국을 우리 땅으로 만든 장군은?",["이사부","김유신","장보고","강감찬"],0],
["독도의 날에 하기 좋은 활동은?",["독도 사랑 포스터 그리기","쓰레기 버리기","독도 모르는 척하기","독도에 낙서하기"],0],
["독도에서 자라는 꽃은?",["튤립","벚꽃","해국","해바라기"],2],
["독도를 지키는 일을 하는 곳은?",["우체국","농협","119구조대","독도경비대"],3],
["독도는 우리나라의 어느 쪽 끝에 있을까요?",["북쪽 끝","동쪽 끝","남쪽 끝","서쪽 끝"],1],
["안용복은 일본에 건너가 어떤 말을 했을까요?",["울릉도와 독도는 조선 땅이에요","나를 왕으로 모셔라","보물섬을 찾았어요","학교를 지어 주세요"],0],
["독도의 옛 이름 중 하나로 알맞은 것은?",["한라도","백두도","우산도","금강도"],2],
["독도는 소중한 자연을 지키려고 어떤 곳으로 정해졌을까요?",["천연보호구역","쇼핑몰","공장 지역","골프장"],0],
["독도에 있는 바위 이름으로 알맞은 것은?",["피라미드바위","촛대바위","에펠바위","시계탑바위"],1],
["이사부와 우산국 이야기가 실린 옛 역사책은?",["동의보감","훈민정음","삼국사기","직지"],2],
["6·25 전쟁 뒤 독도를 지키려고 모인 민간인 모임은?",["독도의용수비대","소방대","태권도부","합창단"],0],
["예전에 독도 바위에 많이 살았던 바다 동물은?",["북극곰","강치","펭귄","코끼리"],1],
["옛날 울릉도와 독도에 있던 나라의 이름은?",["가야","백제","발해","우산국"],3],
["독도에서 배들이 길을 잃지 않게 불을 비춰 주는 건물은?",["등대","학교","놀이공원","도서관"],0],
["독도를 영어로 알릴 때 쓰는 이름은?",["Dodo","Docdo","Dokdo","Dukdo"],2],
["독도에서 울릉도까지의 거리는 약 얼마일까요?",["8km","87km","870km","2,000km"],1],
["친구가 독도에 대해 물었어요. 바르게 알려 준 말은?",["독도는 동해에 있는 대한민국 영토야","독도는 서해에 있는 섬이야","독도는 사람이 만든 인공섬이야","독도는 일본 땅이야"],0]
];
var custom=[],deck=[],i=0,pts=0,wr=0,ac;
var $=function(id){return document.getElementById(id)};
function load(){try{custom=JSON.parse(localStorage.getItem("dokdoCustom")||"[]")}catch(e){custom=[]}if(!Array.isArray(custom))custom=[]}
function persist(){try{localStorage.setItem("dokdoCustom",JSON.stringify(custom))}catch(e){}}
function bank(){return BASE.concat(custom)}
function show(id){["start","play","end","add"].forEach(function(x){$(x).hidden=x!==id});window.scrollTo(0,0);if(id==="start")$("cnt").textContent=bank().length}
function beep(f,d,t,dl){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+(dl||0);o.type=t||"sine";o.frequency.value=f;g.gain.setValueAtTime(.2,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
function sOk(){beep(660,.15);beep(880,.25,"sine",.12)}
function sNo(){beep(220,.3,"sawtooth")}
function sEnd(){[523,659,784,1047].forEach(function(f,k){beep(f,.25,"triangle",k*.15)})}
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=a[k];a[k]=a[j];a[j]=t}return a}
function newGame(){deck=shuffle(bank()).slice(0,10);i=0;pts=0;show("play");render()}
function render(){
  var q=deck[i];wr=0;
  $("no").textContent=(i+1)+" / 10";$("sc").textContent=pts+"점";
  $("bar").style.width=(i/10*100)+"%";
  $("q").textContent=(i+1)+". "+q[0];
  $("msg").textContent="";$("msg").className="msg";$("next").hidden=true;
  var box=$("opts");box.innerHTML="";
  var order=shuffle([0,1,2,3]);
  order.forEach(function(k,n){
    var b=document.createElement("button");b.className="opt";b.textContent=(n+1)+"  "+q[1][k];
    b.onclick=function(){pick(b,k===q[2])};box.appendChild(b);
  });
}
function pick(b,right){
  if(right){
    var g=10-2*wr;pts+=g;b.classList.add("ok");sOk();
    $("sc").textContent=pts+"점";
    $("msg").textContent="🎉 정답이에요! +"+g+"점";$("msg").className="msg ok";
    Array.prototype.forEach.call($("opts").children,function(x){x.disabled=true});
    $("next").textContent=i===9?"결과 보기":"다음 문제";$("next").hidden=false;
  }else{
    wr++;b.classList.add("no");b.disabled=true;sNo();
    $("msg").textContent="🤔 다시 생각해보세요! (-2점 · 지금 맞히면 "+(10-2*wr)+"점)";$("msg").className="msg no";
  }
}
function finish(){
  $("bar").style.width="100%";show("end");sEnd();
  $("final").textContent=pts+" / 100점";
  $("medal").textContent=pts>=90?"🏆":pts>=60?"🥈":"🌱";
  $("comment").textContent=pts>=90?"독도 박사님이에요! 정말 대단해요!":pts>=60?"잘했어요! 조금만 더 알아보면 박사가 될 수 있어요.":"괜찮아요! 다시 도전하면 더 잘할 수 있어요.";
}
function listMine(){
  var m=$("mine");m.innerHTML="";
  if(!custom.length)return;
  var h=document.createElement("b");h.textContent="내가 만든 문제 "+custom.length+"개";m.appendChild(h);
  custom.forEach(function(c,k){
    var d=document.createElement("div"),s=document.createElement("span"),x=document.createElement("button");
    s.textContent=c[0];x.textContent="삭제";
    x.onclick=function(){custom.splice(k,1);persist();listMine()};
    d.appendChild(s);d.appendChild(x);m.appendChild(d);
  });
}
$("go").onclick=newGame;$("again").onclick=newGame;$("home").onclick=function(){show("start")};
$("next").onclick=function(){if(i<9){i++;render()}else finish()};
$("addBtn").onclick=function(){$("addMsg").textContent="";listMine();show("add")};
$("back").onclick=function(){show("start")};
$("save").onclick=function(){
  var q=$("nq").value.trim(),ins=document.querySelectorAll("input.no"),o=[],k;
  for(k=0;k<4;k++)o.push(ins[k].value.trim());
  var a=+document.querySelector("input[name=ans]:checked").value,m=$("addMsg");
  if(!q||o.some(function(v){return!v})){m.textContent="문제와 보기 4개를 모두 입력해 주세요.";m.className="msg no";return}
  if(new Set(o).size<4){m.textContent="보기가 서로 달라야 해요.";m.className="msg no";return}
  custom.push([q,o,a]);persist();
  $("nq").value="";for(k=0;k<4;k++)ins[k].value="";
  m.textContent="✅ 저장했어요! 문제은행이 "+bank().length+"문제가 됐어요.";m.className="msg ok";listMine();
};
load();show("start");
</script>
</body>
</html>
