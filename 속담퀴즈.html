<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>속담 이어 맞추기</title>
<style>
:root{--bg:#fff7e6;--card:#ffffff;--ink:#3a2a14;--sub:#7a6444;--main:#ff8a1f;--main-d:#c75f00;--ok:#2e9e5b;--bad:#d64545;--line:#f0dcb8;--hint:#fff0c9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1f1810;--card:#2b2117;--ink:#fbeed6;--sub:#c9b28c;--main:#ff9a3c;--main-d:#b25500;--ok:#4cc883;--bad:#ff7070;--line:#4a3a24;--hint:#3b2e1a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1f1810;--card:#2b2117;--ink:#fbeed6;--sub:#c9b28c;--main:#ff9a3c;--main-d:#b25500;--ok:#4cc883;--bad:#ff7070;--line:#4a3a24;--hint:#3b2e1a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Jua","Noto Sans KR","Malgun Gothic",sans-serif;display:flex;justify-content:center;align-items:flex-start;padding:16px;overflow-x:hidden}
.screen{display:none;width:100%;max-width:760px;margin-top:2vh}
.screen.on{display:block}
.card{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 10px 0 var(--line)}
#startCard{text-align:center}
h1{font-size:clamp(34px,7vw,56px);margin:0 0 8px;color:var(--main);text-shadow:0 2px 0 var(--main-d),0 5px 0 var(--line)}
p.desc{color:var(--sub);font-size:clamp(16px,3vw,20px);line-height:1.6;margin:0 0 22px}
.setting{background:var(--hint);border-radius:20px;padding:20px;margin:18px 0;transform:translateZ(30px);box-shadow:0 6px 0 var(--line)}
.setting .t{font-size:clamp(28px,6vw,44px);color:var(--main-d);font-weight:700}
input[type=range]{width:100%;accent-color:var(--main);height:36px}
.btn{font:inherit;font-weight:700;font-size:clamp(20px,4vw,28px);color:#fff;background:var(--main);border:0;border-radius:20px;padding:14px 34px;cursor:pointer;box-shadow:0 8px 0 var(--main-d);transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--main-d)}
.btn.sub{background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:0 6px 0 var(--line);font-size:clamp(16px,3vw,20px);padding:10px 20px}
.btn:disabled{opacity:.45}
.btn.sub.on{background:var(--main);color:#fff;border-color:var(--main-d);box-shadow:0 6px 0 var(--main-d)}
.file{margin-top:18px;font-size:15px;color:var(--sub)}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border:3px solid var(--line);border-radius:18px;text-align:center;padding:8px 4px;box-shadow:0 5px 0 var(--line)}
.stat small{display:block;color:var(--sub);font-size:14px}
.stat b{font-size:clamp(22px,5vw,32px);color:var(--main-d)}
.stat.low b{color:var(--bad);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.q{font-size:clamp(30px,7vw,56px);text-align:center;margin:18px 0;line-height:1.35;word-break:keep-all}
.q span{color:var(--main);border-bottom:5px dotted var(--main)}
.hintbox{min-height:48px;text-align:center;font-size:clamp(24px,5vw,36px);letter-spacing:4px;color:var(--main-d);background:var(--hint);border-radius:16px;padding:8px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
input[type=text]{font:inherit;font-size:clamp(22px,5vw,32px);width:100%;padding:12px 16px;border-radius:16px;border:3px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;margin-bottom:14px}
input[type=text]:focus{outline:none;border-color:var(--main)}
#fb{min-height:80px;text-align:center;font-size:clamp(18px,4vw,26px);margin-top:14px;line-height:1.5}
#fb.ok{color:var(--ok)}#fb.bad{color:var(--bad)}
#fb .exp{display:block;color:var(--ink);background:var(--hint);border-radius:14px;padding:10px;margin-top:6px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.big{font-size:clamp(40px,9vw,72px);color:var(--main);text-align:center;margin:0 0 6px}
@media (max-width:520px){body{padding:10px}.card{padding:18px;border-radius:22px}.setting{padding:14px}.btn{padding:12px 20px}.row .btn{flex:1 1 100%}#nbtn .btn{flex:1 1 28%;padding:10px 6px}.stats{gap:6px}.stat small{font-size:12px}.hintbox{letter-spacing:2px}.res{gap:6px}}
.res{display:flex;gap:10px;margin:16px 0}
ul.wl{list-style:none;padding:0;margin:0;max-height:34vh;overflow-y:auto;text-align:left}
ul.wl li{padding:8px 12px;border-bottom:2px dashed var(--line);font-size:clamp(16px,3.4vw,20px)}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<section id="s0" class="screen on">
 <div class="card" id="startCard">
  <h1>🐯 속담 이어 맞추기</h1>
  <p class="desc">속담의 앞부분을 보고 뒷부분을 완성해 보세요!<br>막히면 초성 힌트를 쓸 수 있어요. (최대 2번)</p>
  <div class="setting">
   <div style="color:var(--sub)">문제당 제한시간</div>
   <div class="t" id="tv">20초</div>
   <input type="range" id="tr" min="0" max="60" step="5" value="20" aria-label="문제당 제한시간">
   <div style="display:flex;justify-content:space-between;color:var(--sub);font-size:14px"><span>0초 (제한 없음)</span><span>60초</span></div>
  </div>
  <div class="setting" style="margin-top:0">
   <div style="color:var(--sub);margin-bottom:10px">문제 수</div>
   <div class="row" id="nbtn"><button class="btn sub on" data-n="10">10문제</button><button class="btn sub" data-n="30">30문제</button><button class="btn sub" data-n="50">50문제</button></div>
  </div>
  <button class="btn" id="go">게임 시작! ▶</button>
  <div class="file">선생님용: 속담 CSV 파일 넣기 (없으면 기본 문제로 출제돼요) <input type="file" id="csv" accept=".csv,text/csv"><div id="cnt"></div><button class="btn sub" id="rst" style="display:none;margin-top:8px">기본 문제로 되돌리기</button></div>
 </div>
</section>

<section id="s1" class="screen">
 <div class="stats">
  <div class="stat"><small>점수</small><b id="sc">0</b></div>
  <div class="stat"><small>맞힌 개수</small><b id="co">0</b></div>
  <div class="stat" id="tb"><small>남은 시간</small><b id="tl">0</b></div>
 </div>
 <div class="card">
  <div id="prog" style="text-align:center;color:var(--sub)"></div>
  <div class="q" id="q"></div>
  <div class="hintbox" id="hb">힌트: 아직 사용하지 않았어요</div>
  <input type="text" id="ans" placeholder="뒷부분을 입력하세요" autocomplete="off">
  <div class="row">
   <button class="btn sub" id="hint">💡 초성 힌트 (2번 남음)</button>
   <button class="btn" id="ok">확인 ✔</button>
  </div>
  <div id="fb"></div>
  <div class="row"><button class="btn sub" id="nx" style="display:none">다음 문제 ▶</button></div>
 </div>
</section>

<section id="s2" class="screen">
 <div class="card" style="text-align:center">
  <div class="big" id="endT">🎉 게임 끝!</div>
  <div class="res">
   <div class="stat"><small>점수</small><b id="r1"></b></div>
   <div class="stat"><small>맞힌 개수</small><b id="r2"></b></div>
   <div class="stat"><small>틀린 개수</small><b id="r3"></b></div>
  </div>
  <div id="wrongArea"></div>
  <button class="btn" id="again" style="margin-top:18px">다시 하기 🔄</button>
 </div>
</section>

<script>
const BASE=`앞부분,뒷부분,전체 속담
가는 말이 고와야,오는 말이 곱다,가는 말이 고와야 오는 말이 곱다
낮말은 새가 듣고,밤말은 쥐가 듣는다,낮말은 새가 듣고 밤말은 쥐가 듣는다
세 살 버릇,여든까지 간다,세 살 버릇 여든까지 간다
티끌 모아,태산,티끌 모아 태산
시작이,반이다,시작이 반이다
천 리 길도,한 걸음부터,천 리 길도 한 걸음부터
원숭이도,나무에서 떨어진다,원숭이도 나무에서 떨어진다
돌다리도,두들겨 보고 건너라,돌다리도 두들겨 보고 건너라
급할수록,돌아가라,급할수록 돌아가라
공든 탑이,무너지랴,공든 탑이 무너지랴
친구 따라,강남 간다,친구 따라 강남 간다
피는,물보다 진하다,피는 물보다 진하다
팔은,안으로 굽는다,팔은 안으로 굽는다
믿는 도끼에,발등 찍힌다,믿는 도끼에 발등 찍힌다
열 길 물속은 알아도,한 길 사람 속은 모른다,열 길 물속은 알아도 한 길 사람 속은 모른다
가재는,게 편,가재는 게 편이다
남의 떡이,더 커 보인다,남의 떡이 더 커 보인다
보기 좋은 떡이,먹기도 좋다,보기 좋은 떡이 먹기도 좋다
말 한마디에,천 냥 빚도 갚는다,말 한마디에 천 냥 빚도 갚는다
미운 놈,떡 하나 더 준다,미운 놈 떡 하나 더 준다
백지장도,맞들면 낫다,백지장도 맞들면 낫다
구슬이 서 말이라도,꿰어야 보배,구슬이 서 말이라도 꿰어야 보배
열 번 찍어,안 넘어가는 나무 없다,열 번 찍어 안 넘어가는 나무 없다
콩 심은 데 콩 나고,팥 심은 데 팥 난다,콩 심은 데 콩 나고 팥 심은 데 팥 난다
뿌린 대로,거둔다,뿌린 대로 거둔다
우물을 파도,한 우물을 파라,우물을 파도 한 우물을 파라
낫 놓고,기역 자도 모른다,낫 놓고 기역 자도 모른다
서당 개 삼 년이면,풍월을 읊는다,서당 개 삼 년이면 풍월을 읊는다
고생 끝에,낙이 온다,고생 끝에 낙이 온다
소 잃고,외양간 고친다,소 잃고 외양간 고친다
호랑이도 제 말 하면,온다,호랑이도 제 말 하면 온다
등잔 밑이,어둡다,등잔 밑이 어둡다
꿩 대신,닭,꿩 대신 닭
사공이 많으면,배가 산으로 간다,사공이 많으면 배가 산으로 간다
빈 수레가,요란하다,빈 수레가 요란하다
아니 땐 굴뚝에,연기 날까,아니 땐 굴뚝에 연기 날까
우물 안,개구리,우물 안 개구리
하늘이 무너져도,솟아날 구멍이 있다,하늘이 무너져도 솟아날 구멍이 있다
가는 날이,장날,가는 날이 장날
개천에서,용 난다,개천에서 용 난다
벼는 익을수록,고개를 숙인다,벼는 익을수록 고개를 숙인다
달면 삼키고,쓰면 뱉는다,달면 삼키고 쓰면 뱉는다
도토리,키 재기,도토리 키 재기
고래 싸움에,새우 등 터진다,고래 싸움에 새우 등 터진다
꿩 먹고,알 먹기,꿩 먹고 알 먹기
누워서,떡 먹기,누워서 떡 먹기
산 넘어,산,산 넘어 산
목마른 사람이,우물 판다,목마른 사람이 우물 판다
열 손가락 깨물어,안 아픈 손가락 없다,열 손가락 깨물어 안 아픈 손가락 없다
백문이,불여일견,백문이 불여일견`;

const $=id=>document.getElementById(id);
const CHO=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const norm=s=>s.replace(/[\s.,!?~'"’‘“”·…]/g,"");

function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c=='"') q=true;
    else if(c==","){row.push(cur);cur="";}
    else if(c=="\n"||c=="\r"){ if(c=="\r"&&text[i+1]=="\n")i++; row.push(cur);cur="";rows.push(row);row=[]; }
    else cur+=c;
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  const head=rows[0].map(h=>h.trim());
  let f=head.indexOf("앞부분"),b=head.indexOf("뒷부분"),a=head.indexOf("전체 속담");
  if(f<0){f=head.length>=4?1:0;b=f+1;a=f+2;}
  return rows.slice(1).map(r=>({f:(r[f]||"").trim(),b:(r[b]||"").trim(),a:(r[a]||"").trim()})).filter(x=>x.f&&x.b)
    .map(x=>({...x,a:x.a||x.f+" "+x.b}));
}
const EXTRA=`가랑비에|옷 젖는 줄 모른다
같은 값이면|다홍치마
개구리 올챙이 적|생각 못 한다
계란으로|바위 치기
금강산도|식후경
꼬리가 길면|밟힌다
내 코가|석 자
땅 짚고|헤엄치기
똥 묻은 개가|겨 묻은 개 나무란다
마른하늘에|날벼락
바늘 도둑이|소 도둑 된다
발 없는 말이|천 리 간다
배보다|배꼽이 더 크다
병 주고|약 준다
빛 좋은|개살구
사촌이 땅을 사면|배가 아프다
새 발의|피
쇠뿔도|단김에 빼라
엎질러진|물
윗물이 맑아야|아랫물이 맑다
작은 고추가|더 맵다
종로에서 뺨 맞고|한강에서 화풀이한다
첫술에|배부르랴
하룻강아지|범 무서운 줄 모른다
될성부른 나무는|떡잎부터 알아본다
우물에서|숭늉 찾는다
아는 길도|물어 가라
쇠귀에|경 읽기
식은 죽|먹기
불난 집에|부채질한다
아닌 밤중에|홍두깨
원수는|외나무다리에서 만난다`;
const BUILTIN=parseCSV(BASE).concat(EXTRA.split("\n").map(l=>{const p=l.split("|");return {f:p[0],b:p[1],a:p[0]+" "+p[1]};}));
let DATA=BUILTIN;
function srcInfo(){$("cnt").textContent=(DATA===BUILTIN?"기본 문제 ":"선생님 CSV ")+DATA.length+"개로 출제돼요";$("rst").style.display=DATA===BUILTIN?"none":"";}
srcInfo();

// 시작 화면
$("tr").oninput=e=>{const v=+e.target.value;$("tv").textContent=v?v+"초":"제한 없음";};
$("rst").onclick=()=>{DATA=BUILTIN;$("csv").value="";srcInfo();};
$("nbtn").onclick=e=>{const b=e.target.closest("button");if(!b)return;N=+b.dataset.n;[...$("nbtn").children].forEach(x=>x.classList.toggle("on",x===b));};
$("csv").onchange=e=>{
  const fl=e.target.files[0];if(!fl)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=parseCSV(r.result);if(d.length){DATA=d;srcInfo();}else $("cnt").textContent="문제를 찾지 못했어요. 파일을 확인해 주세요.";}catch(x){$("cnt").textContent="파일을 읽지 못했어요.";}};
  r.readAsText(fl,"utf-8");
};

// 소리
let AC;
function tone(freqs,dur=.12,type="sine",vol=.15){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  freqs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*dur;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur*1.6);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur*1.7);});}catch(e){}
}
const sndOk=()=>tone([523,659,784,1046],.11,"triangle");
const sndBad=()=>tone([220,165],.18,"sawtooth",.1);
const sndEnd=()=>tone([784,659,523,659,784,1046],.13,"triangle");

// 폭죽
const cv=$("fx"),cx=cv.getContext("2d");let ps=[],raf=0;
function size(){cv.width=innerWidth;cv.height=innerHeight;}size();addEventListener("resize",size);
function burst(){
  const cols=["#ff5252","#ffb300","#4caf50","#29b6f6","#ab47bc","#ff80ab"];
  for(let k=0;k<3;k++){
    const x=innerWidth*(.2+Math.random()*.6),y=innerHeight*(.2+Math.random()*.3);
    for(let i=0;i<50;i++){const a=Math.random()*6.283,s=2+Math.random()*6;
      ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:60+Math.random()*30,c:cols[i%6]});}
  }
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  ps=ps.filter(p=>p.l>0);
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.99;p.l--;cx.globalAlpha=Math.min(1,p.l/30);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,4,0,6.283);cx.fill();});
  cx.globalAlpha=1;
  raf=ps.length?requestAnimationFrame(loop):0;
  if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}

// 게임
let N=10,rec=null,log=[],tries=0,per=0,Q=[],idx=0,score=0,right=0,time=0,total=0,hints=0,locked=false,timer=0,wrongs=[],cur=null,nextT=0;
const show=n=>["s0","s1","s2"].forEach((id,i)=>$(id).classList.toggle("on",i==n));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

$("go").onclick=()=>{
  per=+$("tr").value;Q=shuffle(DATA).slice(0,N);idx=0;log=[];score=0;right=0;wrongs=[];
  show(1);next();
  clearInterval(timer);
  timer=setInterval(()=>{
    if(!per||locked)return;
    time--;updStats();
    if(time<=0)reveal("시간이 다 됐어요! ⏰");
  },1000);
};
function updStats(){
  $("sc").textContent=score;$("co").textContent=right;$("tl").textContent=per?time+"초":"제한 없음";
  $("tb").classList.toggle("low",!!per&&time<=5);
}
function next(){
  clearTimeout(nextT);
  if(idx>=Q.length){end();return;}
  cur=Q[idx++];hints=0;tries=0;locked=false;time=per;updStats();rec={c:cur,t:[],st:"w"};log.push(rec);$("prog").textContent=idx+" / "+Q.length+" 문제";
  $("q").innerHTML=cur.f+" <span>&nbsp;&nbsp;&nbsp;&nbsp;?&nbsp;&nbsp;&nbsp;&nbsp;</span>";
  $("hb").textContent="힌트: 아직 사용하지 않았어요";
  $("hint").disabled=false;$("hint").textContent="💡 초성 힌트 (2번 남음)";
  $("fb").textContent="";$("fb").className="";
  $("nx").style.display="none";$("ok").disabled=false;
  $("ans").value="";$("ans").disabled=false;$("ans").focus();
}
function hintText(){
  let first=true;
  return [...cur.b].map(ch=>{
    if(ch==" ")return "  ";
    const c=ch.charCodeAt(0)-0xAC00;
    const isH=c>=0&&c<=11171;
    let out=isH?CHO[Math.floor(c/588)]:ch;
    if(hints>=2&&first)out=ch;
    first=false;return out;
  }).join(" ");
}
$("hint").onclick=()=>{
  if(locked||hints>=2)return;
  hints++;$("hb").textContent=hintText();
  const left=2-hints;
  $("hint").textContent="💡 초성 힌트 ("+left+"번 남음)";
  if(!left)$("hint").disabled=true;
  $("ans").focus();
};
// 유연한 채점: 띄어쓰기·문장부호 무시, 끝 어미(다/라/요 등) 무시, 조사(이/가/은/는 등)만 다른 경우 허용
const FLEX="이가은는을를도에의과와만로으";
const END=/(이다|입니다|이에요|예요|이야|이라|다|라|랴|까|요|죠)$/;
const stem=s=>s.replace(END,"");
const fc=ch=>FLEX.includes(ch)?.4:1;
function dist(a,b){
  const m=a.length,n=b.length,d=[];
  for(let i=0;i<=m;i++){d[i]=[i?d[i-1][0]+fc(a[i-1]):0];}
  for(let j=1;j<=n;j++)d[0][j]=d[0][j-1]+fc(b[j-1]);
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    const sub=a[i-1]==b[j-1]?0:(FLEX.includes(a[i-1])&&FLEX.includes(b[j-1])?.4:1);
    d[i][j]=Math.min(d[i-1][j]+fc(a[i-1]),d[i][j-1]+fc(b[j-1]),d[i-1][j-1]+sub);
  }
  return d[m][n];
}
function isRight(v){
  const f=norm(cur.f);
  if(v.startsWith(f)&&v.length>f.length)v=v.slice(f.length);
  const c=[norm(cur.b)];
  if(cur.a.startsWith(cur.f)){const r=norm(cur.a.slice(cur.f.length));if(r)c.push(r);}
  return c.some(t=>{const a=stem(t),b=stem(v);return a&&b&&dist(a,b)<1;});
}
function submit(){
  if(locked)return;
  const v=norm($("ans").value);if(!v)return;rec.t.push($("ans").value.trim());
  if(isRight(v)){
    locked=true;rec.st=tries?"r":"o";const pt=Math.max(10-3*hints-3*tries,1);score+=pt;right++;updStats();
    $("fb").className="ok";$("fb").textContent="정답이에요! 🎉 +"+pt+"점 (맞힌 개수 "+right+"개"+(per?", 남은 시간 "+time+"초":"")+")";
    $("ans").disabled=true;$("ok").disabled=true;$("hint").disabled=true;
    sndOk();burst();
    nextT=setTimeout(next,1000);
  }else if(tries<1){
    tries++;sndBad();
    $("fb").className="bad";
    $("fb").textContent="앗, 아쉬워요! 한 번 더 도전해 보세요 💪"+(hints<2?" (초성 힌트를 써 봐도 좋아요)":"")+" 이번에 맞히면 점수가 3점 줄어요.";
    $("fb").classList.add("shake");setTimeout(()=>$("fb").classList.remove("shake"),400);
    $("ans").value="";$("ans").focus();
  }else{
    reveal("앗, 아쉬워요! 😢");
  }
}
function reveal(msg){
  locked=true;wrongs.push(cur);
  $("fb").className="bad";
  $("fb").innerHTML=msg+'<span class="exp">정답: <b>'+cur.f+" "+cur.b+"</b><br>완성된 속담 → "+cur.a+"</span>";
  $("fb").classList.add("shake");setTimeout(()=>$("fb").classList.remove("shake"),400);
  $("ans").disabled=true;$("ok").disabled=true;$("hint").disabled=true;
  $("nx").style.display="";sndBad();$("nx").focus();
}
$("ok").onclick=submit;
$("nx").onclick=next;
$("ans").addEventListener("keydown",e=>{if(e.key=="Enter"&&!e.isComposing)submit();});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&locked&&$("nx").style.display!="none"&&!e.isComposing)next();});

function end(){
  clearInterval(timer);clearTimeout(nextT);
  const done=time>0&&idx>=Q.length&&locked;
  $("endT").textContent=right>=Math.ceil(Math.min(Q.length,idx)*.8)&&right>0?"🏆 대단해요!":"🎉 게임 끝!";
  $("r1").textContent=score+"점";$("r2").textContent=right+"개";$("r3").textContent=wrongs.length+"개";
  const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const sec=(t,a)=>a.length?'<h3>'+t+' ('+a.length+')</h3><ul class="wl" style="max-height:none">'+a.join("")+'</ul>':"";
  const W=log.filter(x=>x.st=="w"),R=log.filter(x=>x.st=="r"),O=log.filter(x=>x.st=="o");
  $("wrongArea").innerHTML='<div style="max-height:50vh;overflow-y:auto;text-align:left">'
   +(W.length?"":"<p style='text-align:center'>틀린 문제가 없어요! 👏</p>")
   +sec("❌ 틀린 문제",W.map(x=>'<li><b>'+esc(x.c.a)+'</b><br>내가 쓴 답: <span style="color:var(--bad)">'+(x.t.length?x.t.map(esc).join(" → "):"(답을 쓰지 못했어요)")+'</span><br>정답: <span style="color:var(--ok)">'+esc(x.c.b)+'</span></li>'))
   +sec("🔁 다시 풀어 맞췄어요",R.map(x=>'<li><b>'+esc(x.c.a)+'</b><br>처음에 쓴 답: '+esc(x.t[0]||"")+'</li>'))
   +sec("✅ 맞춘 문제",O.map(x=>'<li>'+esc(x.c.a)+'</li>'))
   +'</div>';
  show(2);sndEnd();if(right)burst();
}
$("again").onclick=()=>{show(0);};
</script>
</body>
