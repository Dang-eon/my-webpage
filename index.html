<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 시작 페이지</title>
  <style>
    :root {
      --bg1: #eef2ff;
      --bg2: #f8fafc;
      --card: rgba(255,255,255,.88);
      --text: #172033;
      --muted: #64748b;
      --accent: #4f46e5;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      justify-content: center;
      padding: 48px 20px;
    }
    .container { width: min(900px, 100%); }
    header { text-align: center; margin-bottom: 28px; }
    .greeting { color: var(--muted); font-size: 15px; margin-bottom: 8px; }
    #clock { font-size: clamp(42px, 9vw, 76px); font-weight: 750; letter-spacing: -2px; }
    #date { color: var(--muted); font-size: 17px; margin-top: 4px; }
    .search {
      display: flex;
      gap: 10px;
      background: var(--card);
      padding: 12px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(30,41,59,.10);
      margin-bottom: 22px;
    }
    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      padding: 12px 14px;
      font-size: 17px;
      color: var(--text);
    }
    button {
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      padding: 0 20px;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
    }
    button:hover { filter: brightness(.95); }
    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(30,41,59,.10);
    }
    .card h2 { margin: 0 0 16px; font-size: 21px; }
    .todo-form { display: flex; gap: 10px; margin-bottom: 16px; }
    .todo-form input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
    }
    .todo-form input:focus { border-color: var(--accent); }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 4px;
      border-bottom: 1px solid var(--border);
    }
    li:last-child { border-bottom: 0; }
    li span { flex: 1; }
    li.done span { text-decoration: line-through; color: var(--muted); }
    .delete {
      background: transparent;
      color: var(--muted);
      padding: 5px 8px;
      font-size: 18px;
    }
    .delete:hover { color: #dc2626; }
    .empty { color: var(--muted); text-align: center; padding: 12px; }
    @media (max-width: 520px) {
      body { padding-top: 30px; }
      .search button { padding: 0 14px; }
      .todo-form { flex-direction: column; }
      .todo-form button { padding: 12px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div class="greeting">좋은 하루 보내세요!</div>
      <div id="clock">00:00:00</div>
      <div id="date">날짜를 불러오는 중...</div>
    </header>

    <form class="search" id="searchForm">
      <input id="searchInput" type="search" placeholder="Google에서 검색하세요" autocomplete="off">
      <button type="submit">검색</button>
    </form>

    <section class="card">
      <h2>오늘의 할 일</h2>
      <form class="todo-form" id="todoForm">
        <input id="todoInput" type="text" placeholder="할 일을 입력하세요" maxlength="120">
        <button type="submit">추가</button>
      </form>
      <ul id="todoList"></ul>
    </section>
  </main>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const todoList = $("#todoList");
    const todoInput = $("#todoInput");

    function updateDateTime() {
      const now = new Date();
      $("#clock").textContent = now.toLocaleTimeString("ko-KR", {
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
      });
      $("#date").textContent = now.toLocaleDateString("ko-KR", {
        year: "numeric", month: "long", day: "numeric", weekday: "long"
      });
    }

    function loadTodos() {
      return JSON.parse(localStorage.getItem("myStartPageTodos") || "[]");
    }

    function saveTodos(todos) {
      localStorage.setItem("myStartPageTodos", JSON.stringify(todos));
    }

    function renderTodos() {
      const todos = loadTodos();
      todoList.innerHTML = "";

      if (!todos.length) {
        todoList.innerHTML = '<li class="empty">아직 등록된 할 일이 없습니다.</li>';
        return;
      }

      todos.forEach((todo, index) => {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.addEventListener("change", () => {
          const current = loadTodos();
          current[index].done = checkbox.checked;
          saveTodos(current);
          renderTodos();
        });

        const text = document.createElement("span");
        text.textContent = todo.text;

        const del = document.createElement("button");
        del.type = "button";
        del.className = "delete";
        del.title = "삭제";
        del.textContent = "×";
        del.addEventListener("click", () => {
          const current = loadTodos();
          current.splice(index, 1);
          saveTodos(current);
          renderTodos();
        });

        li.append(checkbox, text, del);
        todoList.appendChild(li);
      });
    }

    $("#searchForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const query = $("#searchInput").value.trim();
      if (query) {
        window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(query);
      }
    });

    $("#todoForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const text = todoInput.value.trim();
      if (!text) return;

      const todos = loadTodos();
      todos.push({ text, done: false });
      saveTodos(todos);
      todoInput.value = "";
      renderTodos();
      todoInput.focus();
    });

    updateDateTime();
    setInterval(updateDateTime, 1000);
    renderTodos();
  </script>
</body>
</html>
