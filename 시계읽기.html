<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시계 읽기 연습</title>
<style>
:root{--bg:#fff8e7;--card:#ffffff;--ink:#2b2b3a;--sub:#6b6b80;--accent:#ff8a3d;--ok:#2e9d57;--bad:#e0483e;--line:#e8dfc8;--hour:#e0483e;--min:#2a6fdb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b26;--card:#2a2938;--ink:#f4f1ea;--sub:#b3b0c4;--line:#3d3b50;--hour:#ff7a70;--min:#6fa3ff}}
:root[data-theme="dark"]{--bg:#1c1b26;--card:#2a2938;--ink:#f4f1ea;--sub:#b3b0c4;--line:#3d3b50;--hour:#ff7a70;--min:#6fa3ff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Jua","Noto Sans KR","Apple SD Gothic Neo",sans-serif;padding:12px;min-height:100%}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:12px}
h1{font-size:1.6rem;margin:4px 0;text-align:center}
.card{background:var(--card);border-radius:20px;padding:14px;border:2px solid var(--line)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.levels button{font:inherit;font-size:1rem;padding:12px 4px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;line-height:1.25}
.levels button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border-radius:14px;padding:8px}
.stats b{display:block;font-size:1.6rem}
.clockbox{display:flex;justify-content:center;position:relative}
svg{width:min(100%,380px);height:auto}
.answer{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:1.5rem}
.answer input{font:inherit;font-size:2rem;width:90px;text-align:center;padding:8px;border-radius:14px;border:3px solid var(--line);background:var(--bg);color:var(--ink)}
.answer input:focus{outline:none;border-color:var(--accent)}
.btn{font:inherit;font-size:1.3rem;padding:12px 26px;border-radius:16px;border:none;background:var(--ok);color:#fff;cursor:pointer;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn.next{background:var(--min)}
.btn:active{transform:translateY(3px);box-shadow:none}
.msg{min-height:3.2em;text-align:center;font-size:1.2rem;line-height:1.5}
.msg.ok{color:var(--ok);font-weight:700;font-size:1.6rem}
.msg.bad{color:var(--bad)}
.msg .hint{display:block;color:var(--ink);background:var(--bg);border-radius:12px;padding:8px 10px;margin-top:6px;font-size:1.05rem;text-align:left}
.q{text-align:center;color:var(--sub)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{font:inherit;font-size:1.9rem;line-height:1;width:52px;height:52px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.stepper button:active{transform:translateY(2px);box-shadow:none}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.answer input{-moz-appearance:textfield}
.answer input::-webkit-inner-spin-button,.answer input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.answer input[readonly]{opacity:.7}
.btn.review{background:var(--accent);font-size:1.05rem;padding:10px 18px;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.sheet{background:var(--card);border-radius:20px;padding:16px;max-width:560px;width:100%;max-height:85vh;overflow:auto;border:2px solid var(--line)}
.wi{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:1.15rem}
.wi svg{width:110px;height:110px;flex:none}
.shake{animation:shake .5s}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (max-width:480px){body{padding:8px}h1{font-size:1.3rem}.levels{gap:6px}.levels button{font-size:.85rem;padding:10px 2px}.stats b{font-size:1.3rem}.answer{font-size:1.2rem;gap:6px}.answer input{width:64px;font-size:1.5rem;padding:6px}.stepper{gap:4px}.stepper button{width:44px;height:44px;font-size:1.6rem}.btn{font-size:1.15rem}.msg{font-size:1.05rem}.wi svg{width:90px;height:90px}}
@media (min-width:900px){.wrap{max-width:820px}svg{width:min(100%,420px)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.fx span{position:absolute;bottom:-60px;font-size:3rem;animation:up 2.2s ease-in forwards}
.fx span.c{top:-60px;bottom:auto;font-size:2rem;animation:down 1.8s ease-in forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(20deg)}}
@keyframes down{to{transform:translateY(115vh) rotate(360deg)}}
.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.06)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>⏰ 시계 읽기 연습</h1>
  <div class="card levels" id="levels"></div>
  <div class="card stats">
    <div>총 문제<b id="sTotal">0</b></div>
    <div>맞춘 문제 ⭕<b id="sOk" style="color:var(--ok)">0</b></div>
    <div>틀린 문제 ❌<b id="sBad" style="color:var(--bad)">0</b></div>
  </div>
  <div class="card">
    <div class="q" id="qText">지금 몇 시 몇 분일까요?</div>
    <div class="clockbox" id="clockbox">
      <svg viewBox="-110 -110 220 220" id="clock" role="img" aria-label="아날로그 시계"></svg>
    </div>
    <div class="answer" id="answer">
      <div class="stepper"><button id="hhM" aria-label="시 줄이기">−</button><input id="hh" type="number" inputmode="numeric" min="1" max="12" value="12" aria-label="시"><button id="hhP" aria-label="시 늘리기">+</button></div>시
      <div class="stepper"><button id="mmM" aria-label="분 줄이기">−</button><input id="mm" type="number" inputmode="numeric" min="0" max="59" value="0" aria-label="분"><button id="mmP" aria-label="분 늘리기">+</button></div>분
      <button class="btn" id="check">확인 ✔</button>
    </div>
    <div class="msg" id="msg"></div>
    <div style="text-align:center"><button class="btn next" id="nextBtn" style="display:none">다음 문제 ➡</button></div>
    <div style="text-align:center"><button class="btn review" id="reviewBtn">📒 틀린 문제 모아보기 (0)</button></div>
  </div>
</div>
<div class="fx" id="fx"></div>
<div class="modal" id="modal"><div class="sheet"><h2 style="margin:0 0 8px">📒 틀린 문제 모아보기</h2><div id="modalList"></div><div style="text-align:center;margin-top:12px"><button class="btn next" id="modalClose">닫기</button></div></div></div>
<script>
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("clock");
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
// 시계판
el("circle",{r:104,fill:"#ffb84d"});
el("circle",{r:100,fill:"var(--card)"});
for(let i=0;i<60;i++){
  const big=i%5===0,a=i*6*Math.PI/180,r1=96,r2=big?85:90;
  el("line",{x1:Math.sin(a)*r1,y1:-Math.cos(a)*r1,x2:Math.sin(a)*r2,y2:-Math.cos(a)*r2,stroke:"var(--ink)","stroke-width":big?2.4:1,"stroke-linecap":"round"});
}
for(let n=1;n<=12;n++){
  const a=n*30*Math.PI/180;
  const t=el("text",{x:Math.sin(a)*68,y:-Math.cos(a)*68,"text-anchor":"middle","dominant-baseline":"central","font-size":22,"font-weight":700,fill:"var(--ink)","font-family":"inherit"});
  t.textContent=n;
}
const hourHand=el("line",{x1:0,y1:8,x2:0,y2:-46,stroke:"var(--hour)","stroke-width":7,"stroke-linecap":"round"});
const minHand=el("line",{x1:0,y1:10,x2:0,y2:-80,stroke:"var(--min)","stroke-width":4,"stroke-linecap":"round"});
el("circle",{r:5,fill:"var(--ink)"});
// t = 12시간 시계 기준 총 분(0~720). 분침 = t*6도, 시침 = t*0.5도 → 항상 연동
function draw(t){
  hourHand.setAttribute("transform","rotate("+(t*0.5)+")");
  minHand.setAttribute("transform","rotate("+(t*6)+")");
}
let curT=0,anim=null;
function animateTo(target){
  cancelAnimationFrame(anim);
  const from=curT%720;let dist=(target-from+720)%720;
  if(dist<60)dist+=720;
  const dur=1400,st=performance.now();
  function step(now){
    const p=Math.min(1,(now-st)/dur),e=1-Math.pow(1-p,3);
    curT=from+dist*e;draw(curT);
    if(p<1)anim=requestAnimationFrame(step);else{curT=target;draw(curT)}
  }
  anim=requestAnimationFrame(step);
}
// 문제 상태
const LV=[{n:"1단계",d:"정시"},{n:"2단계",d:"30분 단위"},{n:"3단계",d:"5분 단위"},{n:"4단계",d:"1분 단위"}];
let level=0,H=0,M=0,solved=false,stats={t:0,o:0,b:0},timer=null;
const $=id=>document.getElementById(id);
const lv=$("levels");
LV.forEach((l,i)=>{const b=document.createElement("button");b.innerHTML=l.n+"<br><small>"+l.d+"</small>";b.onclick=()=>{level=i;renderLv();newQ()};lv.appendChild(b)});
function renderLv(){[...lv.children].forEach((b,i)=>b.classList.toggle("on",i===level))}
function newQ(){
  clearTimeout(timer);
  const step=[60,30,5,1][level];
  H=1+Math.floor(Math.random()*12);
  M=step===60?0:Math.floor(Math.random()*(60/step))*step;
  solved=false;
  $("hh").value=12;$("mm").value=0;cfgMin();
  $("msg").className="msg";$("msg").innerHTML="";
  $("nextBtn").style.display="none";
  $("check").style.display="";
  animateTo((H%12)*60+M);
}
function hint(){
  const k=Math.floor(M/5),r=M%5;
  let s="👉 <b>짧은 바늘(시침)</b>은 "+(M===0?H+"을(를) 정확히 가리켜요.":H+"과(와) "+(H%12+1)+" 사이에 있어요. 지나간 숫자 "+H+"이(가) 시예요.");
  s+="<br>👉 <b>긴 바늘(분침)</b>은 ";
  if(M===0)s+="12를 가리켜요. 0분이에요.";
  else if(r===0)s+=k+"을(를) 가리켜요. "+k+" × 5 = "+M+"분이에요.";
  else s+=k+"에서 "+r+"칸 더 갔어요. "+k+" × 5 = "+(k*5)+", 거기에 "+r+"칸 더해서 "+M+"분이에요.";
  return '<span class="hint">'+s+"</span>";
}
function updateStats(){$("sTotal").textContent=stats.t;$("sOk").textContent=stats.o;$("sBad").textContent=stats.b}
function celebrate(){
  const fx=$("fx");const em=["🎈","🎈","🎉","🎊","⭐"];
  for(let i=0;i<10;i++){const s=document.createElement("span");s.textContent="🎈";s.style.left=(5+Math.random()*88)+"%";s.style.animationDelay=(Math.random()*.5)+"s";fx.appendChild(s)}
  for(let i=0;i<22;i++){const s=document.createElement("span");s.className="c";s.textContent=em[2+Math.floor(Math.random()*3)];s.style.left=(Math.random()*95)+"%";s.style.animationDelay=(Math.random()*.6)+"s";fx.appendChild(s)}
  setTimeout(()=>fx.innerHTML="",2800);
}
function check(){
  if(solved)return;
  const h=$("hh").value,m=$("mm").value;
  if(h===""||m===""){$("msg").className="msg bad";$("msg").textContent="시와 분을 모두 써 주세요 ✏️";return}
  solved=true;stats.t++;
  if(+h===H&&+m===M){
    stats.o++;
    $("msg").className="msg ok pop";$("msg").textContent="🎉 정답! 참 잘했어요! 🎉";
    celebrate();timer=setTimeout(newQ,1800);
  }else{
    stats.b++;wrongs.push({H,M,level,h:+h,m:+m});updateReview();
    $("clockbox").classList.add("shake");setTimeout(()=>$("clockbox").classList.remove("shake"),600);
    $("msg").className="msg bad";
    $("msg").innerHTML="😢 아쉬워요! 정답은 <b>"+H+"시 "+M+"분</b>이에요."+hint();
    $("check").style.display="none";$("nextBtn").style.display="";
  }
  updateStats();
}
$("check").onclick=check;
$("nextBtn").onclick=newQ;
document.addEventListener("keydown",e=>{if(e.key==="Enter"){solved?($("nextBtn").style.display!=="none"&&newQ()):check()}});
let wrongs=[];
function minStep(){return [15,15,5,1][level]}
function cfgMin(){const mm=$("mm");mm.step=minStep();mm.readOnly=false;$("mmM").disabled=false;$("mmP").disabled=false}
$("hhM").onclick=()=>{let v=+$("hh").value||12;$("hh").value=v<=1?12:v-1};
$("hhP").onclick=()=>{let v=+$("hh").value||12;$("hh").value=v>=12?1:v+1};
$("mmM").onclick=()=>{const s=minStep();let v=(+$("mm").value||0)-s;if(v<0)v=60-s;$("mm").value=v};
$("mmP").onclick=()=>{const s=minStep();let v=(+$("mm").value||0)+s;if(v>=60)v=0;$("mm").value=v};
function mini(h,m){const t=(h%12)*60+m;let s='<svg viewBox="-55 -55 110 110"><circle r="52" fill="var(--card)" stroke="#ffb84d" stroke-width="4"/>';
  for(let i=1;i<=12;i++){const a=i*Math.PI/6;s+='<text x="'+Math.sin(a)*38+'" y="'+(-Math.cos(a)*38)+'" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="var(--ink)">'+i+'</text>'}
  return s+'<line y2="-24" stroke="var(--hour)" stroke-width="4" stroke-linecap="round" transform="rotate('+t*0.5+')"/><line y2="-40" stroke="var(--min)" stroke-width="2.5" stroke-linecap="round" transform="rotate('+t*6+')"/><circle r="3" fill="var(--ink)"/></svg>'}
function updateReview(){$("reviewBtn").textContent="📒 틀린 문제 모아보기 ("+wrongs.length+")"}
function openReview(){
  $("modalList").innerHTML=wrongs.length?wrongs.map(w=>'<div class="wi">'+mini(w.H,w.M)+'<div><b>정답 '+w.H+'시 '+w.M+'분</b><br><span style="color:var(--bad)">내 답 '+w.h+'시 '+w.m+'분</span><br><small>'+LV[w.level].n+' · '+LV[w.level].d+'</small></div></div>').join(""):'<p class="q">아직 틀린 문제가 없어요! 👏</p>';
  $("modal").style.display="flex"}
$("reviewBtn").onclick=openReview;
$("modalClose").onclick=()=>$("modal").style.display="none";
$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").style.display="none"};
renderLv();draw(0);newQ();
</script>
</body>
</html>
