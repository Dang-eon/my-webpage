<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스마트 장보기 미션</title>
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#2b2b3a;--sub:#6b6b7e;--main:#ff7a3d;--main2:#ffe3d1;--ok:#2e9e5b;--bad:#e5384f;--line:#f0dcc6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b24;--card:#2a2733;--ink:#f4f1ea;--sub:#b5b0c4;--main2:#4a3326;--line:#3d3948}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:8px 0}
.sub{color:var(--sub)}
.hide{display:none!important}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;background:var(--main);color:#fff;font-weight:700}
button.ghost{background:var(--main2);color:var(--ink)}
button:disabled{background:#bbb;color:#eee;cursor:not-allowed}
.missions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.mission{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:22px;text-align:center;cursor:pointer}
.mission:hover{border-color:var(--main)}
.mission .e{font-size:3.2rem}.mission h2{margin:6px 0;font-size:1.2rem}
.badge{display:inline-block;background:var(--main2);border-radius:99px;padding:4px 12px;font-weight:700}
.layout{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.item .e{font-size:2.4rem}.item b{display:block}
.price{color:var(--main);font-weight:700}
.qty{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0}
.qty button{width:34px;height:34px;padding:0;border-radius:50%;font-size:1.2rem}
.qty span{min-width:24px;font-weight:700}
.item .add{width:100%;padding:8px}
.side{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;position:sticky;top:8px}
.bar{height:14px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.bar i.over{background:var(--bad)}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.cart{list-style:none;margin:8px 0;padding:0;max-height:240px;overflow:auto}
.cart li{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line)}
.cart button{padding:2px 8px;font-size:.8rem;background:var(--main2);color:var(--ink)}
.warn{background:#ffe1e5;color:#b0172d;border-radius:10px;padding:8px 10px;font-weight:700;margin:8px 0}
.receipt{background:var(--card);border:2px dashed var(--main);border-radius:16px;padding:20px;max-width:560px;margin:14px auto}
.receipt h2{text-align:center;margin:0 0 4px}
.receipt table{width:100%;border-collapse:collapse;margin:10px 0}
.receipt td,.receipt th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.receipt td:last-child,.receipt th:last-child{text-align:right}
.tot{font-weight:700;font-size:1.05rem}
textarea{width:100%;min-height:110px;font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink)}
.reason-out{display:none;white-space:pre-wrap;border:2px solid var(--line);border-radius:12px;padding:10px;min-height:60px}
.capture textarea{display:none}.capture .reason-out{display:block}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.toast{text-align:center;color:var(--ok);font-weight:700;min-height:1.4em}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;z-index:9}
.overlay img{max-width:100%;max-height:75vh;border-radius:10px;background:#fff}
.overlay p{color:#fff;margin:0;text-align:center}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}.receipt{border:1px solid #000;margin:0 auto}textarea{display:none}.reason-out{display:block}}
</style>
</head>
<body>
<div class="wrap">

<section id="s1">
  <h1>🛒 스마트 장보기 미션</h1>
  <p class="sub">미션을 고르고, 정해진 예산 안에서 똑똑하게 장을 봐요!</p>
  <div class="missions" id="missions"></div>
</section>

<section id="s2" class="hide">
  <div class="noprint" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
    <h1 id="mTitle"></h1>
    <button class="ghost" onclick="goHome()">← 미션 다시 고르기</button>
  </div>
  <div class="layout">
    <div><div class="grid" id="grid"></div></div>
    <aside class="side">
      <h3 style="margin:0 0 6px">🧺 내 장바구니</h3>
      <div class="row"><span>예산</span><b id="bud"></b></div>
      <div class="row"><span>사용 금액</span><b id="spent"></b></div>
      <div class="bar"><i id="barI"></i></div>
      <div class="row"><span>남은 잔액</span><b id="left"></b></div>
      <div class="row"><span>총 개수</span><b id="cnt"></b></div>
      <div id="warn" class="warn hide">⚠️ 예산을 넘었어요! 장바구니에서 물건을 빼 주세요.</div>
      <ul class="cart" id="cart"></ul>
      <button id="submit" style="width:100%" onclick="submitCart()">제출하기</button>
    </aside>
  </div>
</section>

<section id="s3" class="hide">
  <div id="capture">
    <div class="receipt">
      <h2>🧾 구매 영수증</h2>
      <div class="sub" style="text-align:center" id="rMission"></div>
      <table><thead><tr><th>품목</th><th>수량</th><th>금액</th></tr></thead><tbody id="rBody"></tbody></table>
      <div class="row tot"><span>사용 금액</span><span id="rSpent"></span></div>
      <div class="row tot"><span>남은 잔액</span><span id="rLeft"></span></div>
      <hr style="border:0;border-top:1px dashed var(--line);margin:14px 0">
      <label for="reason"><b>✏️ 이 물건들을 선택한 이유를 작성해 주세요</b></label>
      <div class="sub noprint" style="font-size:.9rem;margin:2px 0 6px">꼭 필요한 물건인가요? 예산은 알맞게 썼나요? 다른 선택도 생각해 보세요.</div>
      <textarea id="reason" placeholder="예) 카레에는 감자와 당근이 꼭 필요해서 먼저 골랐어요. 남은 돈으로…"></textarea>
      <div class="reason-out" id="reasonOut"></div>
    </div>
  </div>
  <div class="actions noprint">
    <button onclick="window.print()">🖨️ 인쇄 / PDF 저장</button>
    <button onclick="savePng()">🖼️ PNG 저장</button>
    <button onclick="copyResult()">📋 결과 복사</button>
    <button class="ghost" onclick="backShop()">← 장바구니 고치기</button>
    <button class="ghost" onclick="goHome()">🏠 처음으로</button>
  </div>
  <div class="toast noprint" id="toast"></div>
</section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
var M=[
{id:"curry",e:"🍛",name:"카레 만들기",budget:15000,items:[
["🥔","감자",1200],["🥕","당근",1500],["🧅","양파",1500],["🍗","닭고기",6000],["🥩","돼지고기",6000],["🍛","카레 가루",3000],["🍚","밥",2000],["🍎","후식용 사과",3500],["🥤","탄산음료",2000]]},
{id:"camp",e:"⛺",name:"여름캠핑 준비하기",budget:30000,items:[
["⛺","일회용 텐트",10000],["🔦","손전등",4000],["🧴","모기 기피제",5000],["🍖","고기",10000],["🌭","소시지",4000],["🍡","마시멜로",2500],["💧","생수",1000],["🧊","얼음팩",3000],["🪑","접이식 의자",5000]]},
{id:"party",e:"🎂",name:"친구 생일파티 준비하기",budget:50000,items:[
["🎂","생일 케이크",15000],["🎈","풍선 세트",5000],["🎉","파티 모자",3000],["🍕","피자",15000],["🍗","치킨",16000],["🥤","음료수",2000],["🍬","과자",1500],["🎁","선물",10000],["🕯️","초와 폭죽",2500]]}
];
var cur=null,cart={},pend={};
var $=function(i){return document.getElementById(i)};
var won=function(n){return n.toLocaleString("ko-KR")+"원"};
function show(id){["s1","s2","s3"].forEach(function(s){$(s).classList.toggle("hide",s!==id)});window.scrollTo(0,0)}

$("missions").innerHTML=M.map(function(m){return '<div class="mission" onclick="start(\''+m.id+'\')"><div class="e">'+m.e+'</div><h2>'+m.name+'</h2><span class="badge">예산 '+won(m.budget)+'</span></div>'}).join("");

function start(id){
  cur=M.filter(function(m){return m.id===id})[0];cart={};pend={};
  $("mTitle").textContent=cur.e+" "+cur.name;
  $("grid").innerHTML=cur.items.map(function(it,i){return '<div class="item"><div class="e">'+it[0]+'</div><b>'+it[1]+'</b><div class="price">'+won(it[2])+'</div><div class="qty"><button onclick="chg('+i+',-1)">−</button><span id="q'+i+'">0</span><button onclick="chg('+i+',1)">+</button></div></div>'}).join("");
  render();show("s2");
}
function chg(i,d){var n=Math.max(0,Math.min(20,(cart[i]||0)+d));if(n)cart[i]=n;else delete cart[i];render()}
function del(i){delete cart[i];render()}
function minus(i){chg(i,-1)}
function total(){var s=0,c=0;for(var k in cart){s+=cur.items[k][2]*cart[k];c+=cart[k]}return{s:s,c:c}}
function render(){
  var t=total(),over=t.s>cur.budget;
  cur.items.forEach(function(_,i){$("q"+i).textContent=cart[i]||0});
  $("bud").textContent=won(cur.budget);$("spent").textContent=won(t.s);
  $("left").textContent=won(cur.budget-t.s);$("left").style.color=over?"var(--bad)":"";
  $("cnt").textContent=t.c+"개";
  var b=$("barI");b.style.width=Math.min(100,t.s/cur.budget*100)+"%";b.className=over?"over":"";
  $("warn").classList.toggle("hide",!over);
  $("submit").disabled=over||t.c===0;
  var ks=Object.keys(cart);
  $("cart").innerHTML=ks.length?ks.map(function(k){var it=cur.items[k];return '<li><span>'+it[0]+' '+it[1]+' × '+cart[k]+'</span><span><b>'+won(it[2]*cart[k])+'</b> <button onclick="minus('+k+')">−1</button> <button onclick="del('+k+')">취소</button></span></li>'}).join(""):'<li class="sub">아직 담은 물건이 없어요.</li>';
}
function submitCart(){
  var t=total();if(t.s>cur.budget||t.c===0)return;
  $("rMission").textContent=cur.e+" "+cur.name+" (예산 "+won(cur.budget)+")";
  $("rBody").innerHTML=Object.keys(cart).map(function(k){var it=cur.items[k];return "<tr><td>"+it[0]+" "+it[1]+"</td><td>"+cart[k]+"개</td><td>"+won(it[2]*cart[k])+"</td></tr>"}).join("");
  $("rSpent").textContent=won(t.s);$("rLeft").textContent=won(cur.budget-t.s);
  $("reason").value="";$("toast").textContent="";show("s3");
}
function backShop(){show("s2")}
function goHome(){show("s1")}
$("reason").addEventListener("input",function(){$("reasonOut").textContent=this.value});

function resultText(){
  var t=total();
  var lines=["[스마트 장보기 미션] "+cur.name+" (예산 "+won(cur.budget)+")",""];
  Object.keys(cart).forEach(function(k){var it=cur.items[k];lines.push(it[0]+" "+it[1]+" "+cart[k]+"개 - "+won(it[2]*cart[k]))});
  lines.push("","사용 금액: "+won(t.s),"남은 잔액: "+won(cur.budget-t.s),"","구매 이유:",$("reason").value||"(작성하지 않음)");
  return lines.join("\n");
}
function toast(m){$("toast").textContent=m;setTimeout(function(){$("toast").textContent=""},3000)}
function copyResult(){
  var txt=resultText();
  function fallback(){
    var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand("copy")}catch(e){}
    document.body.removeChild(ta);toast(ok?"복사했어요! 📋":"복사에 실패했어요. 인쇄 기능을 이용해 주세요.");
  }
  try{navigator.clipboard.writeText(txt).then(function(){toast("복사했어요! 📋")},fallback)}catch(e){fallback()}
}
function savePng(){
  if(typeof html2canvas==="undefined"){toast("PNG 저장 도구를 불러오지 못했어요. 인쇄 기능을 이용해 주세요.");return}
  var el=$("capture");$("reasonOut").textContent=$("reason").value;document.body.classList.add("capture");
  html2canvas(el,{backgroundColor:getComputedStyle(document.body).backgroundColor,scale:2}).then(function(c){
    document.body.classList.remove("capture");
    var url=c.toDataURL("image/png");
    var o=document.createElement("div");o.className="overlay";
    o.innerHTML='<p>이미지를 길게 누르거나 오른쪽 클릭해서 저장하세요 👇</p><img src="'+url+'" alt="영수증"><div><a id="dl" download="smart-shopping.png" href="'+url+'"><button>⬇️ 다운로드</button></a> <button class="ghost" id="cl">닫기</button></div>';
    document.body.appendChild(o);
    o.querySelector("#cl").onclick=function(){document.body.removeChild(o)};
  }).catch(function(){document.body.classList.remove("capture");toast("PNG 저장에 실패했어요.")});
}
</script>
</body>
</html>
